<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LOKI</title>
<style>
/* LOKI glass: graphite glass, soft sage -> slate -> lilac accent, rounded bevels (owner's look, 2026-10). */
:root{
  --bg:#141417; --glass:rgba(30,30,35,.78); --glass2:rgba(255,255,255,.045); --glass3:rgba(255,255,255,.08);
  --edge:rgba(255,255,255,.08); --hi:rgba(255,255,255,.07); --text:#e4e4e7; --muted:#a1a1aa; --dim:#71717a;
  --accent:#8ccfc4; --lilac:#a596c4; --warn:#e5c07b; --bad:#e88686; --good:#8ccfc4;
  --grad:linear-gradient(135deg,#7fcfc2 0%,#8aa4b8 55%,#a596c4 100%);
  --grad-soft:linear-gradient(135deg,rgba(110,196,182,.20),rgba(122,150,170,.16) 55%,rgba(160,140,190,.18));
  --r:16px; --r2:11px; --pad:1.1%;
  --bevel:inset 0 1px 0 var(--hi), inset 0 -1px 0 rgba(0,0,0,.25), 0 10px 34px rgba(0,0,0,.32);
  --ease:cubic-bezier(.2,.7,.2,1); --scale:1;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;color:var(--text);
  font:calc(14px * var(--scale))/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased;
  background:radial-gradient(1200px 800px at 75% -10%,rgba(122,150,170,.08),transparent 60%),
    radial-gradient(900px 700px at -10% 110%,rgba(110,196,182,.06),transparent 60%),
    radial-gradient(800px 600px at 110% 100%,rgba(160,140,190,.06),transparent 60%),var(--bg)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,textarea,select{font:inherit;color:inherit}
::-webkit-scrollbar{width:9px;height:9px}::-webkit-scrollbar-thumb{background:rgba(255,255,255,.09);border-radius:9px;border:2px solid transparent;background-clip:padding-box}
.glass{background:var(--glass);border:1px solid var(--edge);border-radius:var(--r);box-shadow:var(--bevel)}
svg.i{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* top bar */
.top{position:absolute;inset:0 0 auto 0;height:48px;display:flex;align-items:center;gap:8px;padding:0 12px}
.brand{font-weight:700;letter-spacing:.16em;font-size:13px;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;padding-right:6px}
.crumb{color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:40%}
.sp{flex:1}
.chipm{font-size:11.5px;color:var(--muted);padding:3px 10px;border-radius:99px;border:1px solid var(--edge);background:var(--glass2);white-space:nowrap}
.chipm b{font-weight:600;color:var(--text)}
.ib{position:relative;width:32px;height:32px;display:inline-flex;align-items:center;justify-content:center;border-radius:10px;color:var(--muted);transition:.15s var(--ease)}
.ib:hover{background:var(--glass3);color:var(--text)}
.ib.on{color:var(--accent)}
[data-tip]{position:relative}
[data-tip]:hover::after{content:attr(data-tip);position:absolute;z-index:50;top:calc(100% + 8px);right:0;width:max-content;max-width:240px;white-space:normal;
  padding:7px 10px;border-radius:9px;background:rgba(22,22,26,.97);border:1px solid var(--edge);box-shadow:var(--bevel);color:var(--text);font-size:12px;line-height:1.35;font-weight:400;pointer-events:none}
.tipup[data-tip]:hover::after{top:auto;bottom:calc(100% + 8px)}
.tipl[data-tip]:hover::after{right:auto;left:0}

/* docking layout: left | center | right, bottom under center. Nothing overlaps. */
.stage{position:absolute;inset:48px 0 0 0;display:grid;padding:0 var(--pad) var(--pad);gap:0}
.zone{display:flex;flex-direction:column;min-width:0;min-height:0;gap:10px}
.zone.horiz{flex-direction:row}
.zone.empty{display:none}
.split{position:relative;cursor:col-resize;width:10px}.split::after{content:"";position:absolute;inset:30% 4px;border-radius:2px;background:transparent;transition:.15s}
.split:hover::after,.split.drag::after{background:var(--grad)}
.split.h{cursor:row-resize;height:10px;width:auto}.split.h::after{inset:4px 30%}
.center{min-width:0;min-height:0;display:flex;flex-direction:column}
.panel{display:flex;flex-direction:column;min-height:0;min-width:0;overflow:hidden;flex:1 1 0}
.panel.collapsed{flex:0 0 auto!important}
.panel.collapsed .pbody{display:none}
.ph{display:flex;align-items:center;gap:6px;height:38px;padding:0 6px 0 10px;cursor:grab;user-select:none;border-bottom:1px solid transparent}
.panel:not(.collapsed) .ph{border-bottom-color:var(--edge)}
.ph .t{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:7px}
.ph .t svg{color:var(--accent)}
.ph .ib{width:26px;height:26px;border-radius:8px}
.badge{font-size:10.5px;font-weight:700;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--warn);color:#1a1a1a;display:inline-flex;align-items:center;justify-content:center}
.pbody{flex:1;overflow:auto;padding:10px;min-height:0}
.innersplit{height:8px;cursor:row-resize;flex:none;margin:-9px 0}.zone.horiz .innersplit{width:8px;height:auto;margin:0 -9px;cursor:col-resize}
.dropmark{background:var(--grad);border-radius:3px;flex:none;height:3px;margin:-6px 8px}.zone.horiz .dropmark{width:3px;height:auto;margin:8px -6px}
.zone.drophint{outline:1px dashed rgba(140,207,196,.4);outline-offset:-2px;border-radius:var(--r);min-width:60px;min-height:60px}
.ghost{position:fixed;z-index:80;pointer-events:none;padding:8px 14px;border-radius:12px;font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase}

/* chat */
.chat{flex:1;display:flex;flex-direction:column;min-height:0}
.ch-h{display:flex;align-items:center;gap:8px;height:46px;padding:0 10px 0 16px;border-bottom:1px solid var(--edge)}
.ch-h .ttl{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st{font-size:11px;padding:2px 9px;border-radius:99px;border:1px solid var(--edge);color:var(--muted);text-transform:capitalize;white-space:nowrap}
.st.running,.st.planning{color:var(--accent);border-color:rgba(140,207,196,.45)}
.st.waiting{color:var(--warn);border-color:rgba(229,192,123,.5)}
.st.done{color:var(--good)}.st.failed,.st.stopped{color:var(--bad);border-color:rgba(232,134,134,.4)}.st.resting{color:var(--dim)}
.dotlive{width:7px;height:7px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 0 rgba(140,207,196,.6);animation:pulse 1.6s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 7px rgba(140,207,196,0)}100%{box-shadow:0 0 0 0 rgba(140,207,196,0)}}
.feed{flex:1;overflow:auto;padding:18px 0 8px}
.col{width:min(780px,92%);margin:0 auto;display:flex;flex-direction:column;gap:10px}
.msg{display:flex;gap:10px;align-items:flex-start;animation:in .25s var(--ease)}
@keyframes in{from{opacity:0;transform:translateY(4px)}}
.msg.owner{justify-content:flex-end}
.bub{max-width:82%;padding:10px 14px;border-radius:16px;line-height:1.55;word-wrap:break-word}
.owner .bub{background:var(--grad-soft);border:1px solid rgba(140,207,196,.18);border-bottom-right-radius:6px;box-shadow:inset 0 1px 0 var(--hi)}
.loki .bub{background:var(--glass2);border:1px solid var(--edge);border-top-left-radius:6px;box-shadow:inset 0 1px 0 var(--hi)}
.av{width:26px;height:26px;border-radius:9px;flex:none;background:var(--grad);display:flex;align-items:center;justify-content:center;color:#16161a;font-weight:800;font-size:12px;margin-top:2px}
.bub code{font:12.5px ui-monospace,Menlo,Consolas,monospace;background:rgba(0,0,0,.25);padding:1px 5px;border-radius:5px}
.bub pre{font:12px/1.5 ui-monospace,Menlo,Consolas,monospace;background:rgba(0,0,0,.28);padding:8px 10px;border-radius:9px;overflow:auto;white-space:pre-wrap}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px;margin-top:8px}
.thumbs img,.lib img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px;border:1px solid var(--edge);display:block;cursor:zoom-in;background:#0d0d10}
.tools{display:flex;flex-direction:column;gap:3px;margin-left:36px}
.tc{border-radius:10px;border:1px solid transparent;transition:.15s}
.tc>.row1{display:flex;align-items:center;gap:8px;padding:5px 9px;font-size:12.5px;color:var(--muted);cursor:pointer;border-radius:10px}
.tc>.row1:hover{background:var(--glass2);color:var(--text)}
.tc .lbl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
.tc .lbl b{color:var(--text);font-weight:500}
.tc .ok{color:var(--good)}.tc .no{color:var(--bad)}
.tc.open{border-color:var(--edge);background:rgba(0,0,0,.18)}
.tc .more{display:none;padding:2px 10px 10px}
.fold{font-size:12px;color:var(--dim);padding:4px 9px;border-radius:9px;text-align:left}
.fold:hover{color:var(--text);background:var(--glass2)}
.times{font-size:11px;color:var(--dim);padding:0 6px;border-radius:6px;background:var(--glass2)}
.tc.open .more{display:block}
.tc pre{margin:6px 0 0;font:11.5px/1.5 ui-monospace,Menlo,Consolas,monospace;color:var(--muted);white-space:pre-wrap;max-height:320px;overflow:auto;background:rgba(0,0,0,.25);padding:8px;border-radius:8px}
.mono{font:11.5px ui-monospace,Menlo,Consolas,monospace}
.ask{margin-left:36px;padding:12px 14px;border-radius:14px;border:1px solid rgba(229,192,123,.35);background:rgba(229,192,123,.06);box-shadow:inset 0 1px 0 var(--hi)}
.ask .q{font-size:13px;margin-bottom:8px}
.ask textarea{width:100%;min-height:70px;resize:vertical;padding:9px 11px;border-radius:10px;border:1px solid var(--edge);background:rgba(0,0,0,.25);outline:none}
.ask textarea:focus{border-color:rgba(140,207,196,.5)}
.btns{display:flex;gap:8px;justify-content:flex-end;margin-top:9px}
.btn{padding:7px 14px;border-radius:10px;border:1px solid var(--edge);background:var(--glass2);box-shadow:inset 0 1px 0 var(--hi);font-size:13px;transition:.15s}
.btn:hover{background:var(--glass3)}
.btn.pri{background:var(--grad);color:#15151a;font-weight:600;border-color:transparent}
.btn.pri:hover{filter:brightness(1.07)}
.typing{margin-left:36px;color:var(--dim);font-size:12.5px;display:flex;align-items:center;gap:8px}
.empty{color:var(--dim);text-align:center;padding:26px 10px;font-size:13px}
.hello{margin:12vh auto 0;text-align:center;max-width:520px}
.hello h1{font-size:28px;margin:0 0 6px;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;letter-spacing:.02em}
.hello p{color:var(--muted);margin:0 0 18px}
.sugs{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.sug{padding:8px 13px;border-radius:12px;border:1px solid var(--edge);background:var(--glass2);font-size:13px;color:var(--muted);box-shadow:inset 0 1px 0 var(--hi)}
.sug:hover{color:var(--text);border-color:rgba(140,207,196,.4)}

/* composer */
.comp{padding:10px 0 14px}
.box{width:min(780px,92%);margin:0 auto;border-radius:18px;background:rgba(255,255,255,.05);border:1px solid var(--edge);box-shadow:var(--bevel);transition:.15s}
.box:focus-within{border-color:rgba(140,207,196,.42)}
.box textarea{width:100%;border:0;outline:0;background:transparent;resize:none;padding:13px 16px 4px;max-height:34vh;min-height:24px;display:block}
.bar{display:flex;align-items:center;gap:4px;padding:4px 8px 8px}
.seg{display:inline-flex;border-radius:10px;background:rgba(0,0,0,.22);padding:2px;border:1px solid var(--edge)}
.seg button{padding:3px 10px;border-radius:8px;font-size:12px;color:var(--muted)}
.seg button.on{background:var(--glass3);color:var(--text);box-shadow:inset 0 1px 0 var(--hi)}
.sel{appearance:none;font-size:12px;color:var(--muted);background:rgba(0,0,0,.22);border:1px solid var(--edge);border-radius:10px;padding:4px 24px 4px 10px;max-width:190px;
  background-image:linear-gradient(45deg,transparent 50%,#a1a1aa 50%),linear-gradient(135deg,#a1a1aa 50%,transparent 50%);background-position:calc(100% - 13px) 50%,calc(100% - 9px) 50%;background-size:4px 4px;background-repeat:no-repeat}
.sel option{background:#1c1c20;color:var(--text)}
.ctx{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;color:var(--dim);padding:0 6px}
.ring{width:18px;height:18px;border-radius:50%}
.send{width:34px;height:34px;border-radius:11px;background:var(--grad);color:#15151a;display:inline-flex;align-items:center;justify-content:center}
.send:disabled{opacity:.35;cursor:default}
.send.stop{background:var(--glass3);color:var(--text)}

/* panels content */
.list{display:flex;flex-direction:column;gap:5px}
.job{width:100%;padding:9px 11px;border-radius:12px;border:1px solid transparent;cursor:pointer;transition:.15s}
.job:hover{background:var(--glass2)}
.job.cur{background:var(--glass2);border-color:var(--edge);box-shadow:inset 0 1px 0 var(--hi)}
.job .g{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13px}
.job .m{display:flex;align-items:center;gap:7px;margin-top:4px;font-size:11.5px;color:var(--dim)}
.lib{display:grid;grid-template-columns:repeat(auto-fill,minmax(var(--thumb,110px),1fr));gap:8px}
.lib .it{position:relative}
.lib .cap{position:absolute;inset:auto 6px 6px 6px;font-size:10.5px;padding:2px 7px;border-radius:7px;background:rgba(12,12,14,.72);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:0;transition:.15s}
.lib .it:hover .cap{opacity:1}
.pager{display:flex;align-items:center;gap:6px;margin-top:10px;font-size:12px;color:var(--dim)}
.range{accent-color:var(--accent);width:100%}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:12.5px}.kv div:nth-child(odd){color:var(--dim)}
.mrow{display:flex;align-items:center;gap:8px;padding:6px 4px;border-bottom:1px solid var(--edge);font-size:12.5px}
.mrow:last-child{border-bottom:0}
.dot{width:8px;height:8px;border-radius:50%;flex:none;background:var(--dim)}.dot.ok{background:var(--good)}.dot.no{background:var(--bad)}
.mrow .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fy{padding:10px 12px;border-radius:12px;border:1px solid rgba(229,192,123,.3);background:rgba(229,192,123,.05);margin-bottom:8px;font-size:12.5px}
.fy .g{color:var(--muted);font-size:11.5px;margin-bottom:4px;cursor:pointer}
.task{display:flex;gap:8px;padding:5px 2px;font-size:12.5px}.task .mk{width:16px;text-align:center;flex:none}
.task .ev{color:var(--dim);font-size:11.5px}

/* drag & drop */
.atts{display:flex;flex-wrap:wrap;gap:6px;padding:10px 12px 0}
.att{position:relative;display:flex;align-items:center;gap:7px;padding:4px 26px 4px 4px;border-radius:10px;border:1px solid var(--edge);background:rgba(0,0,0,.22);font-size:12px;color:var(--muted);max-width:220px}
.att img{width:34px;height:34px;object-fit:cover;border-radius:7px}
.att .fi{width:34px;height:34px;border-radius:7px;display:flex;align-items:center;justify-content:center;background:var(--glass2)}
.att span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.att button{position:absolute;right:4px;top:50%;transform:translateY(-50%);width:18px;height:18px;border-radius:6px;color:var(--dim);display:flex;align-items:center;justify-content:center}
.att button:hover{color:var(--text);background:var(--glass3)}
.att button svg{width:12px;height:12px}
.att.up{opacity:.55}
.dropov{position:absolute;inset:8px;z-index:20;border-radius:var(--r);border:1.5px dashed rgba(140,207,196,.6);background:rgba(20,26,26,.72);display:none;align-items:center;justify-content:center;flex-direction:column;gap:8px;color:var(--text);font-size:15px;pointer-events:none}
.dropov svg{width:34px;height:34px;color:var(--accent)}
.center.dropping .dropov{display:flex}
.center{position:relative}
.lib img{cursor:grab}
/* overlays */
.pal{position:fixed;z-index:60;left:50%;top:14%;transform:translateX(-50%);width:min(520px,92vw);padding:12px;display:none}
.pal.show{display:block;animation:in .18s var(--ease)}
.pal h4{margin:4px 6px 8px;font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim)}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
.pitem{display:flex;align-items:center;gap:9px;padding:9px 11px;border-radius:11px;border:1px solid var(--edge);background:var(--glass2);font-size:13px;color:var(--muted);text-align:left}
.pitem.on{color:var(--text);border-color:rgba(140,207,196,.4);box-shadow:inset 0 1px 0 var(--hi)}
.pitem.on svg{color:var(--accent)}
.prow{display:flex;align-items:center;gap:10px;padding:6px;font-size:12.5px;color:var(--muted)}
.prow label{width:120px}
.scrim{position:fixed;inset:0;z-index:55;background:rgba(0,0,0,.35);display:none}.scrim.show{display:block}
.lightbox{position:fixed;inset:0;z-index:90;background:rgba(8,8,10,.9);display:none;align-items:center;justify-content:center;flex-direction:column;gap:10px}
.lightbox.show{display:flex}
.lightbox img{max-width:92vw;max-height:84vh;border-radius:12px;box-shadow:0 30px 80px rgba(0,0,0,.6)}
.lightbox .cap{color:var(--muted);font-size:12.5px}
.toast{position:fixed;z-index:95;left:50%;bottom:22px;transform:translateX(-50%);padding:9px 16px;border-radius:12px;font-size:13px;display:none}
.toast.show{display:block;animation:in .2s var(--ease)}
@media (max-width:860px){.stage{display:flex!important;flex-direction:column;overflow:auto}.stage>.split{display:none}.center{min-height:72vh}.zone{min-height:auto}}
</style>
</head>
<body>
<div class="top">
  <span class="brand">LOKI</span>
  <span class="crumb" id="crumb"></span>
  <span class="sp"></span>
  <span class="chipm" id="mach" data-tip="This machine and its driver version">…</span>
  <button class="ib" id="bNew" data-tip="New job — start a fresh conversation (Ctrl/⌘+N)"></button>
  <button class="ib" id="bPal" data-tip="Panels & settings — show, hide and arrange panels (Space)"></button>
  <button class="ib" id="bUpd" data-tip="Update everything — pull master and restart LOKI on this machine; jobs carry on"></button>
</div>
<div class="stage" id="stage"></div>

<div class="scrim" id="scrim"></div>
<div class="pal glass" id="pal"></div>
<div class="lightbox" id="lb"><img id="lbImg" alt=""><div class="cap" id="lbCap"></div></div>
<div class="toast glass" id="toast"></div>

<script>
"use strict";
/* ---------- icons (lucide-style, inline) ---------- */
const P = {
  plus:'<path d="M12 5v14M5 12h14"/>', grid:'<rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/>',
  refresh:'<path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 3v6h-6"/>', send:'<path d="M5 12h14"/><path d="M13 6l6 6-6 6"/>', stop:'<rect x="7" y="7" width="10" height="10" rx="2"/>',
  play:'<path d="M8 5l11 7-11 7z"/>', jobs:'<path d="M4 6h16M4 12h16M4 18h10"/>', image:'<rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="9" cy="10" r="2"/><path d="M21 16l-5-5-9 9"/>',
  bell:'<path d="M6 8a6 6 0 1 1 12 0c0 7 3 8 3 8H3s3-1 3-8"/><path d="M10 20a2 2 0 0 0 4 0"/>', check:'<path d="M20 6L9 17l-5-5"/>', list:'<path d="M9 6h11M9 12h11M9 18h11"/><path d="M4 6h.01M4 12h.01M4 18h.01"/>',
  chip:'<rect x="5" y="5" width="14" height="14" rx="3"/><path d="M9 9h6v6H9zM9 2v3M15 2v3M9 19v3M15 19v3M2 9h3M2 15h3M19 9h3M19 15h3"/>',
  disk:'<ellipse cx="12" cy="6" rx="8" ry="3"/><path d="M4 6v12c0 1.7 3.6 3 8 3s8-1.3 8-3V6"/><path d="M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/>',

document.addEventListener('mousemove', e => {
  if (!drag) return;

  }

      document.querySelectorAll('.zone').forEach(z => { z.classList.remove('empty'); z.classList.add('drophint'); }); }
    drag.ghost.style.left = e.clientX + 12 + 'px'; drag.ghost.style.top = e.clientY + 8 + 'px';
    document.querySelectorAll('.dropmark').forEach(m => m.remove());
    const z = document.elementsFromPoint(e.clientX, e.clientY).find(el => el.classList?.contains('zone'));
    drag.target = null;
    if (z) {
      const horiz = z.classList.contains('horiz');
      const ps = [...z.querySelectorAll('.panel')].filter(p => p.dataset.id !== drag.id);
      let idx = ps.length;

    const merged = [];
    for (const g of group) { const last = merged[merged.length - 1]; if (last && last.sig === g.sig) last.n++; else merged.push({...g, n: 1}); }
    const gid = r.id + ':g' + (gi++), openAll = S.openTools.has(gid), SHOW = 6;
    const hidden = openAll ? 0 : Math.max(0, merged.length - SHOW);
    const rows = merged.slice(hidden).map(m => m.html.replace('<span class="lbl">', m.n > 1 ? `<span class="times">×${m.n}</span><span class="lbl">` : '<span class="lbl">'));
    html += `<div class="tools">${hidden ? `<button class="fold" data-fold="${esc(gid)}">${ic('chev')} ${merged.slice(0, hidden).reduce((a, m) => a + m.n, 0)} earlier steps</button>` : ''}${rows.join('')}</div>`;
    group = [];
  };
  for (const it of c.items) {
    if (it.kind === 'msg') {
      flush();
      const imgs = (it.files || []).filter(f => IMG.test(f));
      html += `<div class="msg ${it.from === 'owner' ? 'owner' : 'loki'}">${it.from === 'owner' ? '' : '<div class="av">L</div>'}<div class="bub">${md(it.from === 'owner' && imgs.length ? it.text.replace(/\n*Attached references: .*$/s, '') : it.text)}
        ${imgs.length ? `<div class="thumbs">${imgs.map(f => `<img loading="lazy" src="${fileUrl(r.id, f)}" data-zoom="${esc(f)}" alt="${esc(f)}">`).join('')}</div>` : ''}</div></div>`;
    } else {
      const [lbl, icon] = toolLabel(it), key = r.id + ':' + it.step;
      const open = S.openTools.has(key);
      const one = `<div class="tc ${open ? 'open' : ''}" data-key="${esc(key)}"><div class="row1">${ic(icon)}<span class="lbl">${lbl}</span>${it.ok ? ic('check','ok') : ic('x','no')}</div>
        <div class="more"><div class="mono" style="color:var(--dim)">${esc(it.provider||'')} · ${esc(it.model||'')}</div>
        ${it.tool === 'write_file' ? `<pre>${esc(String(it.args?.content || '').slice(0, 4000))}</pre>` : `<pre>${esc(JSON.stringify(it.args, null, 1)).slice(0, 2000)}</pre>`}
        <pre>${esc(String(it.result || '').slice(0, 3000))}</pre></div></div>`;
      group.push({html: one, sig: open ? key : it.tool + '|' + lbl + '|' + it.ok});
    }
  }
  flush();
  if (r.status === 'waiting') {
    const pend = r.pending || {}, isImg = pend.name === 'image_prompt', isQ = pend.name === 'ask_owner';
    const pre = isImg ? (pend.args?.prompt || '') : '';
    html += `<div class="ask"><div class="q">${ic(isImg ? 'wand' : isQ ? 'msg' : 'bell')} ${isImg ? '<b>Image prompt</b> — edit it if you like, then approve' : esc(r.waiting_for)}</div>
      ${isImg ? `<div class="mono" style="color:var(--dim);margin-bottom:6px">${esc(pend.args?.purpose || '')}</div><textarea id="askNote">${esc(pre)}</textarea>`
              : `<textarea id="askNote" placeholder="${isQ ? 'Your answer…' : 'Optional note for LOKI…'}"></textarea>`}
      <div class="btns">${isQ ? '' : '<button class="btn" id="askNo">Decline</button>'}<button class="btn pri" id="askYes">${isQ ? 'Answer' : isImg ? 'Approve prompt' : 'Approve'}</button></div></div>`;
  } else if (live) {
    html += `<div class="typing"><span class="dotlive"></span>${r.status === 'resting' ? 'Free models are busy — resting, then carrying on' : 'Working…'}</div>`;
  }
  const askKey = r.status === 'waiting' ? r.id + ':' + r.steps : '';
  const prevNote = $('#askNote'), keepNote = prevNote && prevNote.dataset.k === askKey ? prevNote.value : undefined, focused = document.activeElement?.id === 'askNote';
  if (force || col.dataset.sig !== sig(c)) {
    col.innerHTML = html; col.dataset.sig = sig(c);
    if ($('#askNote')) { $('#askNote').dataset.k = askKey; if (keepNote !== undefined) { $('#askNote').value = keepNote; if (focused) $('#askNote').focus(); } }
    if (atBottom || force) feed.scrollTop = feed.scrollHeight;
  }
  col.querySelectorAll('.tc .row1').forEach(row => row.onclick = () => { const tc = row.parentElement, k = tc.dataset.key;
    tc.classList.toggle('open'); tc.classList.contains('open') ? S.openTools.add(k) : S.openTools.delete(k); });
  col.querySelectorAll('[data-fold]').forEach(b => b.onclick = () => { S.openTools.add(b.dataset.fold); paintChat(true); });
  if ($('#askYes')) $('#askYes').onclick = () => reply(true);
  if ($('#askNo')) $('#askNo').onclick = () => reply(false);
  paintComposer();
}
const sig = c => `${c.run.status}|${c.items.length}|${c.run.steps}|${c.active}`;
async function reply(approve) {
  const note = $('#askNote')?.value || '';
  try { await post(`/runs/${S.sel}/reply`, {approve, note}); toast(approve ? 'Approved' : 'Declined'); } catch (e) { toast('That did not go through'); }
  poll();
}
async function send() {
  const inp = $('#inp'); let text = inp.value.trim();
  if (S.atts.some(a => a.busy)) { toast('Still uploading…'); return; }
  const attach = attPayload();
  if ((!text && !attach.length) || S.sending) return;
  if (!text) text = 'Here are references for this job.';
  S.sending = true; $('#sendB').disabled = true;
  try {
    if (!S.sel) { const r = await post('/runs', {goal: text, mode: S.mode, prefer: S.prefer, attach}); select(r.id); }
    else await post(`/runs/${S.sel}/say`, {text, attach});
    inp.value = ''; inp.style.height = 'auto'; S.atts = []; paintAtts();
  } catch (e) { toast('Could not send — is the driver running?'); }
  S.sending = false; $('#sendB').disabled = false; poll(true);
}
/* attachments: dropped/pasted files upload first; library images are referenced in place */
S.atts = [];
function addAtt(a) { a.key = Math.random().toString(36).slice(2); S.atts.push(a); paintAtts(); paintComposer(); return a; }
function paintAtts() {
  const el = $('#atts'); if (!el) return;
  el.style.display = S.atts.length ? 'flex' : 'none';
  el.innerHTML = S.atts.map(a => `<div class="att ${a.busy ? 'up' : ''}" title="${esc(a.name)}">${a.thumb ? `<img src="${esc(a.thumb)}" alt="">` : `<span class="fi">${ic('file')}</span>`}
    <span>${esc(a.busy ? 'Uploading… ' : '')}${esc(a.name)}</span><button data-unatt="${a.key}" data-tip="Remove">${ic('x')}</button></div>`).join('');
  el.querySelectorAll('[data-unatt]').forEach(b => b.onclick = () => { S.atts = S.atts.filter(a => a.key !== b.dataset.unatt); paintAtts(); paintComposer(); });
}
async function uploadFile(f) {
  if (f.size > 512 * 1024 * 1024) { toast(f.name + ' is over 512 MB'); return; }
  const a = addAtt({kind:'upload', name:f.name, busy:true, thumb: /^image\//.test(f.type) ? URL.createObjectURL(f) : ''});
  try { const r = await api('/upload?name=' + encodeURIComponent(f.name), {method:'POST', body:f}); a.upload = r.upload; a.busy = false; }
  catch (e) { S.atts = S.atts.filter(x => x !== a); toast('Could not upload ' + f.name); }
  paintAtts(); paintComposer();
}
const attPayload = () => S.atts.filter(a => !a.busy).map(a => a.kind === 'ref' ? {run:a.run, path:a.path} : {upload:a.upload});

async function stopJob() { if (!S.sel) return; await post(`/runs/${S.sel}/stop`).catch(() => {}); toast('Stopped — send a message to carry on'); poll(); }
function newJob() { S.sel = null; S.chat = null; paintChat(true); fillPanels(); $('#inp')?.focus(); }
function select(id) { S.sel = id; S.chat = null; S.openTools.clear(); poll(true); }
$('#bNew').onclick = newJob;
$('#bUpd').onclick = async () => { try { await post('/update'); toast('Updating… LOKI restarts in a moment; jobs carry on'); } catch (e) { toast('Update request failed'); } };

/* ---------- panels ---------- */
const visible = id => !L.hidden.includes(id) && !L.collapsed[id] && document.getElementById('body-' + id);
function badge(id, n) { const b = document.getElementById('badge-' + id); if (b) b.innerHTML = n ? `<span class="badge">${n}</span>` : ''; }
function fillPanels(force) {
  const waiting = S.runs.filter(r => r.status === 'waiting');
  badge('foryou', waiting.length);
  if (visible('jobs')) $('#body-jobs').innerHTML = S.runs.length ? `<div class="list">${S.runs.map(r => `<div class="job ${r.id === S.sel ? 'cur' : ''}" data-run="${esc(r.id)}">
      <div class="g">${esc(r.title || r.goal)}</div><div class="m"><span class="st ${esc(r.status)}">${esc(r.status)}</span>${r.active && r.status !== 'waiting' ? '<span class="dotlive"></span>' : ''}<span class="sp"></span>${ago(r.updated)}</div></div>`).join('')}</div>`
    : `<div class="empty">No jobs yet — type in the chat to start one.</div>`;
  if (visible('foryou')) $('#body-foryou').innerHTML = waiting.length ? waiting.map(r => `<div class="fy"><div class="g" data-run="${esc(r.id)}">${esc(r.title || r.goal)}</div>
      <div>${r.pending?.name === 'image_prompt' ? '<b>Image prompt:</b> ' + esc(r.pending.args?.prompt) : esc(r.waiting_for)}</div>
      <div class="btns">${r.pending?.name === 'ask_owner' ? `<button class="btn pri" data-open="${esc(r.id)}">Answer</button>` :
        `<button class="btn" data-no="${esc(r.id)}">Decline</button>${r.pending?.name === 'image_prompt' ? `<button class="btn" data-open="${esc(r.id)}">Edit</button>` : ''}<button class="btn pri" data-yes="${esc(r.id)}">Approve</button>`}</div></div>`).join('')
    : `<div class="empty">Nothing waits for you.</div>`;
  if (visible('tasks')) { const t = S.chat?.tasks || [];
    $('#body-tasks').innerHTML = t.length ? t.map(x => `<div class="task"><span class="mk" style="color:${x.state==='passed'?'var(--good)':x.state==='blocked'?'var(--bad)':'var(--dim)'}">${x.state==='passed'?'✓':x.state==='blocked'?'!':'○'}</span>
      <div>${esc(x.title)}<div class="ev">${esc(x.state === 'todo' ? x.check : x.evidence)}</div></div></div>`).join('') : `<div class="empty">${S.sel ? 'Planning…' : 'Pick a job to see its checklist.'}</div>`; }
  if (visible('library') && (force || !S.libLoaded)) loadLibrary();
  if (visible('models') && (force || !S.modelsShown)) paintModels();
  if (visible('local') && (force || !S.localShown)) loadLocal();
  if (visible('machine')) loadMachine();
}
document.addEventListener('click', async e => {
  const run = e.target.closest('[data-run]'); if (run) { select(run.dataset.run); return; }
  const y = e.target.closest('[data-yes]'), n = e.target.closest('[data-no]'), o = e.target.closest('[data-open]');
  if (y) { await post(`/runs/${y.dataset.yes}/reply`, {approve:true, note:''}).catch(() => {}); toast('Approved'); poll(); }
  if (n) { await post(`/runs/${n.dataset.no}/reply`, {approve:false, note:''}).catch(() => {}); toast('Declined'); poll(); }
  if (o) select(o.dataset.open);
});
async function loadLibrary() {
  S.libLoaded = true; const el = $('#body-library'); if (!el) return;
  let d; try { d = await api(`/library?page=${S.libPage}&per=36`); } catch (e) { return; }
  const pages = Math.max(1, Math.ceil(d.total / d.per));
  el.innerHTML = d.items.length ? `<div class="lib">${d.items.map(x => `<div class="it"><img loading="lazy" draggable="true" data-ref="${esc(JSON.stringify({run:x.run, path:x.path}))}" src="${fileUrl(x.run, x.path)}" data-zoom="${esc(x.title + ' — ' + x.path)}" alt="${esc(x.path)}" title="Drag into the chat to use as a reference"><span class="cap" data-run="${esc(x.run)}">${esc(x.title)}</span></div>`).join('')}</div>
    <div class="pager"><button class="ib" id="lp" data-tip="Previous page">${ic('left')}</button>${S.libPage + 1} / ${pages} · ${d.total} images<button class="ib" id="ln" data-tip="Next page">${ic('right')}</button></div>`
    : `<div class="empty">Images LOKI makes show up here.</div>`;
  if ($('#lp')) $('#lp').onclick = () => { S.libPage = Math.max(0, S.libPage - 1); loadLibrary(); };
  if ($('#ln')) $('#ln').onclick = () => { S.libPage = Math.min(pages - 1, S.libPage + 1); loadLibrary(); };
}
async function loadModels(refresh) {
  try { const m = await api('/models' + (refresh ? '?refresh=1' : '')); if (Array.isArray(m)) S.models = m; } catch (e) {}
  paintComposer(); if (visible('models')) paintModels();
}
function paintModels() {
  S.modelsShown = true; const el = $('#body-models'); if (!el) return;
  el.innerHTML = `<div class="btns" style="margin:0 0 6px"><button class="btn" id="mRef">${'Check all again'}</button></div>` + (S.models.length ? S.models.map(m => `<div class="mrow"><span class="dot ${m.ok?'ok':'no'}"></span>
    <span class="nm" title="${esc(m.model)}">${esc(m.provider)} <span style="color:var(--dim)">${esc(m.role)}</span><br><span class="mono" style="color:var(--dim)">${esc(m.model)}</span></span>
    <span style="color:var(--dim);font-size:11.5px;max-width:40%;text-align:right">${m.ok ? m.ms + ' ms' : esc(m.note).slice(0, 60)}</span></div>`).join('') : '<div class="empty">Checking…</div>');
  $('#mRef').onclick = async () => { $('#mRef').textContent = 'Checking…'; await loadModels(true); };
}
async function loadLocal() {
  S.localShown = true; const el = $('#body-local'); if (!el) return;
  let d; try { d = await api('/local-models'); } catch (e) { return; }
  const ms = d.models || [];
  el.innerHTML = d.error ? `<div class="empty">${esc(d.error)}</div>` : ms.length ? ms.map(m => `<div class="mrow"><span class="dot ok"></span><span class="nm">${esc(m.name)}</span>
    <span style="color:var(--dim);font-size:11.5px">${(m.size/1e9).toFixed(1)} GB</span><button class="ib" data-rm="${esc(m.name)}" data-tip="Remove — delete this model from this machine">${ic('trash')}</button></div>`).join('') : '<div class="empty">No local models.</div>';
  el.querySelectorAll('[data-rm]').forEach(b => b.onclick = async () => {
    if (b.dataset.confirm !== '1') { b.dataset.confirm = '1'; b.style.color = 'var(--bad)'; toast('Click again to remove ' + b.dataset.rm); return; }
    try { await post('/local-models/remove', {name: b.dataset.rm}); toast('Removed ' + b.dataset.rm); } catch (e) { toast('Could not remove it'); }
    loadLocal();
  });
}
async function loadMachine() {
  const el = $('#body-machine'); if (!el) return;
  let s; try { s = await api('/status'); } catch (e) { return; }
  const l = s.launcher || {};
  el.innerHTML = `<div class="kv"><div>Machine</div><div>${esc(s.machine || '?')} · ${esc(s.os)}</div><div>Driver</div><div>${esc(s.version)}</div>
    <div>Commit</div><div class="mono">${esc(l.commit || '?')}</div><div>Working jobs</div><div>${s.active_runs}</div>
    <div>Last update</div><div>${esc(l.last_update || '—')}</div><div>Data</div><div class="mono" style="word-break:break-all">${esc(s.home)}</div></div>`;
}

/* ---------- polling ---------- */
let pollBusy = false;
async function poll(force) {
  if (pollBusy && !force) return; pollBusy = true;
  try {
    const runs = await api('/runs'); S.runs = runs || [];
    if (S.sel) { const c = await api(`/runs/${encodeURIComponent(S.sel)}/chat`).catch(() => null); if (c) S.chat = c; }
    paintChat(force); fillPanels();
  } catch (e) { $('#mach').innerHTML = '<b style="color:var(--bad)">driver offline</b>'; }
  pollBusy = false;
}
async function boot() {
  try { const saved = await api('/layout'); if (saved && saved.zones) L = Object.assign(JSON.parse(JSON.stringify(DEFAULT)), saved); } catch (e) {}
  for (const id of Object.keys(PANELS)) if (!zoneOf(id) && !L.hidden.includes(id)) L.zones.right.push(id);
  render();
  api('/status').then(s => { $('#mach').innerHTML = `<b>${esc(s.machine || s.os)}</b> · v${esc(s.version)}`; }).catch(() => {});
  const runs = await api('/runs').catch(() => []); S.runs = runs || [];
  const live = S.runs.find(r => r.active) || S.runs.find(r => r.status === 'waiting');
  if (live) select(live.id); else poll(true);
  loadModels(false);
  setInterval(poll, 1500);
  setInterval(() => { if (visible('library')) loadLibrary(); if (visible('local')) loadLocal(); }, 15000);
}
boot();
</script>
</body>
