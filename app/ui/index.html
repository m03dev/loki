<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LOKI</title>
<style>
/* LOKI - one clean chat, a slim rail, one drawer. Themes are presets of the same tokens. */
:root{
  --bg:#141417; --glass:rgba(30,30,35,.78); --g2:rgba(255,255,255,.045); --g3:rgba(255,255,255,.085);
  --edge:rgba(255,255,255,.08); --hi:rgba(255,255,255,.07); --text:#e4e4e7; --muted:#a1a1aa; --dim:#71717a;
  --accent:#8ccfc4; --accent2:#a596c4; --mid:#8aa4b8; --warn:#e5c07b; --bad:#e88686; --good:#8ccfc4; --onacc:#15151a;
  --r:16px; --scale:1; --thumb:110px;
  --grad:linear-gradient(135deg,var(--accent) 0%,var(--mid) 55%,var(--accent2) 100%);
  --soft:linear-gradient(135deg,color-mix(in srgb,var(--accent) 20%,transparent),color-mix(in srgb,var(--accent2) 18%,transparent));
  --bevel:inset 0 1px 0 var(--hi),inset 0 -1px 0 rgba(0,0,0,.25),0 10px 34px rgba(0,0,0,.30);
  --ease:cubic-bezier(.2,.7,.2,1);
}
[data-theme=midnight]{--bg:#0d1120;--accent:#7aa2ff;--mid:#8f8cf0;--accent2:#c08cff;--good:#7ad0b0}
[data-theme=ember]{--bg:#16110e;--accent:#f0a868;--mid:#e88a6a;--accent2:#e46f8f;--good:#a8d08c}
[data-theme=forest]{--bg:#0f1511;--accent:#8fd19e;--mid:#b7cf86;--accent2:#d9c47a;--good:#8fd19e}
[data-theme=mono]{--bg:#141414;--accent:#e4e4e7;--mid:#b4b4ba;--accent2:#8f8f96;--good:#c9c9cf}
[data-theme=light]{--bg:#f3f4f6;--glass:rgba(255,255,255,.82);--g2:rgba(20,20,30,.04);--g3:rgba(20,20,30,.08);--edge:rgba(20,20,30,.10);
  --hi:rgba(255,255,255,.9);--text:#18181b;--muted:#52525b;--dim:#8a8a93;--accent:#3f9e90;--mid:#5b7d99;--accent2:#7b68b0;--good:#2f8f78;--warn:#b7791f;--bad:#c0504d;--onacc:#fff;
  --bevel:inset 0 1px 0 var(--hi),0 6px 24px rgba(20,20,40,.08)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;color:var(--text);font:calc(14px * var(--scale))/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  -webkit-font-smoothing:antialiased;background:radial-gradient(1100px 760px at 78% -12%,color-mix(in srgb,var(--mid) 9%,transparent),transparent 60%),
  radial-gradient(900px 700px at -10% 110%,color-mix(in srgb,var(--accent) 7%,transparent),transparent 60%),var(--bg)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,textarea,select{font:inherit;color:inherit}
::-webkit-scrollbar{width:9px;height:9px}::-webkit-scrollbar-thumb{background:var(--g3);border-radius:9px;border:2px solid transparent;background-clip:padding-box}
.glass{background:var(--glass);border:1px solid var(--edge);border-radius:var(--r);box-shadow:var(--bevel)}
svg.i{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
.sp{flex:1}
[data-tip]{position:relative}
[data-tip]:hover::after{content:attr(data-tip);position:absolute;z-index:70;top:calc(100% + 8px);right:0;width:max-content;max-width:250px;white-space:normal;padding:7px 10px;border-radius:9px;
  background:var(--glass);backdrop-filter:blur(8px);border:1px solid var(--edge);box-shadow:var(--bevel);color:var(--text);font-size:12px;line-height:1.35;font-weight:400;pointer-events:none;text-transform:none;letter-spacing:0}
.tr[data-tip]:hover::after{top:50%;right:auto;left:calc(100% + 10px);transform:translateY(-50%)}
.tu[data-tip]:hover::after{top:auto;bottom:calc(100% + 8px)}
.ib{width:34px;height:34px;display:inline-flex;align-items:center;justify-content:center;border-radius:11px;color:var(--muted);transition:.15s var(--ease)}
.ib:hover{background:var(--g3);color:var(--text)}
.ib.on{color:var(--accent);background:var(--g2);box-shadow:inset 0 1px 0 var(--hi)}

/* frame: top bar / rail | drawer | chat (drawer may swap sides) */
.top{position:absolute;inset:0 0 auto 0;height:50px;display:flex;align-items:center;gap:8px;padding:0 14px 0 16px}
.brand{font-weight:800;letter-spacing:.18em;font-size:13px;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.crumb{color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:46vw;padding-left:6px}
.chipm{font-size:11.5px;color:var(--muted);padding:3px 10px;border-radius:99px;border:1px solid var(--edge);background:var(--g2);white-space:nowrap}
.bell{position:relative}.bell .n{position:absolute;top:3px;right:2px;min-width:16px;height:16px;padding:0 4px;border-radius:8px;background:var(--warn);color:#1a1a1a;font-size:10px;font-weight:800;display:flex;align-items:center;justify-content:center}
.bell.ring svg{animation:ring 1.2s var(--ease) 2}
@keyframes ring{0%,100%{transform:rotate(0)}20%{transform:rotate(14deg)}40%{transform:rotate(-12deg)}60%{transform:rotate(8deg)}80%{transform:rotate(-4deg)}}
.frame{position:absolute;inset:50px 0 0 0;display:grid;padding:0 12px 12px 0}
.rail{display:flex;flex-direction:column;align-items:center;gap:6px;padding:6px 0 4px;width:58px}
.rail .ib{width:40px;height:40px;border-radius:13px}
.drawer{min-width:0;min-height:0;display:flex;flex-direction:column;overflow:hidden}
.dh{display:flex;align-items:center;gap:4px;height:44px;padding:0 6px 0 14px;border-bottom:1px solid var(--edge)}
.dh .t{font-size:12px;font-weight:650;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.dh .ib{width:28px;height:28px;border-radius:9px}.dh svg.i{width:16px;height:16px}
.db{flex:1;overflow:auto;padding:12px}
.split{cursor:col-resize;width:12px;position:relative}.split::after{content:"";position:absolute;inset:35% 5px;border-radius:2px}
.split:hover::after,.split.drag::after{background:var(--grad)}
.chatw{min-width:0;min-height:0;display:flex;flex-direction:column;position:relative}
.frame{gap:0}
.menu{position:fixed;z-index:65;min-width:230px;padding:6px;display:none}
.menu.show{display:block;animation:in .14s var(--ease)}
.menu h5{margin:6px 8px 4px;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim)}
.mi{display:flex;align-items:center;gap:9px;width:100%;padding:7px 9px;border-radius:9px;font-size:13px;color:var(--muted);text-align:left}
.mi:hover{background:var(--g3);color:var(--text)}.mi.on{color:var(--accent)}
.mi .pv{display:flex;gap:2px;width:34px;height:20px;flex:none;border-radius:4px;overflow:hidden;border:1px solid var(--edge)}
.mi .pv i{background:var(--g3)}.mi .pv i.c{flex:1;background:var(--g2)}.mi .pv i.a{background:color-mix(in srgb,var(--accent) 55%,transparent)}
.drawer.dropside{outline:1.5px dashed color-mix(in srgb,var(--accent) 60%,transparent);outline-offset:-3px}
.dh{cursor:grab}
.chatw.dropside-l{box-shadow:inset 6px 0 0 color-mix(in srgb,var(--accent) 60%,transparent)}.chatw.dropside-r{box-shadow:inset -6px 0 0 color-mix(in srgb,var(--accent) 60%,transparent)}
@media (max-width:820px){.frame{grid-template-columns:52px 0 0 1fr 0 0!important;padding-right:6px}.drawer.open{position:fixed;z-index:40;inset:56px 8px 8px 62px}.split{display:none}}

/* one bar: the page's top bar is the window's title bar (frameless window) */
.winc{display:flex;gap:2px;margin-left:6px}
.wb{width:40px;height:32px;display:inline-flex;align-items:center;justify-content:center;border-radius:9px;color:var(--muted)}
.wb:hover{background:var(--g3);color:var(--text)}.wb.x:hover{background:#c2423f;color:#fff}
.wb svg.i{width:15px;height:15px}
.rz{position:fixed;z-index:200;display:none}.framed .rz{display:block}
.rz-r{top:0;right:0;width:6px;height:100%;cursor:ew-resize}.rz-b{left:0;bottom:0;height:6px;width:100%;cursor:ns-resize}.rz-c{right:0;bottom:0;width:14px;height:14px;cursor:nwse-resize}
.tps{font-size:10.5px;color:var(--accent);margin-left:4px}
.lesson{font-size:12.5px;padding:6px 8px;border-radius:9px;background:var(--g2);margin-bottom:4px;line-height:1.4}
/* chat */
.ch{display:flex;align-items:center;gap:8px;height:48px;padding:0 10px 0 18px;border-bottom:1px solid var(--edge)}
.ch .ttl{font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st{font-size:11px;padding:2px 9px;border-radius:99px;border:1px solid var(--edge);color:var(--muted);text-transform:capitalize;white-space:nowrap}
.st.running,.st.planning{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 45%,transparent)}
.st.waiting{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 50%,transparent)}
.st.done{color:var(--good)}.st.failed,.st.stopped{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,transparent)}.st.resting{color:var(--dim)}
.prog{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--muted);padding:3px 10px;border-radius:99px;background:var(--g2);border:1px solid var(--edge);cursor:pointer}
.bar{width:64px;height:5px;border-radius:5px;background:var(--g3);overflow:hidden}.bar i{display:block;height:100%;background:var(--grad);border-radius:5px;transition:width .4s var(--ease)}
.live{width:7px;height:7px;border-radius:50%;background:var(--accent);animation:pulse 1.6s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--accent) 60%,transparent)}70%{box-shadow:0 0 0 7px transparent}100%{box-shadow:0 0 0 0 transparent}}
.feed{flex:1;overflow:auto;padding:18px 0 10px}
.col{width:min(800px,92%);margin:0 auto;display:flex;flex-direction:column;gap:10px}
.msg{display:flex;gap:10px;align-items:flex-start;animation:in .25s var(--ease)}
@keyframes in{from{opacity:0;transform:translateY(4px)}}
.msg.me{justify-content:flex-end}
.bub{max-width:84%;padding:10px 14px;border-radius:16px;line-height:1.55;word-wrap:break-word;box-shadow:inset 0 1px 0 var(--hi)}
.me .bub{background:var(--soft);border:1px solid color-mix(in srgb,var(--accent) 20%,transparent);border-bottom-right-radius:6px}
.lk .bub{background:var(--g2);border:1px solid var(--edge);border-top-left-radius:6px}
.av{width:26px;height:26px;border-radius:9px;flex:none;background:var(--grad);display:flex;align-items:center;justify-content:center;color:var(--onacc);font-weight:800;font-size:12px;margin-top:2px}
.bub code{font:12.5px ui-monospace,Menlo,Consolas,monospace;background:rgba(0,0,0,.22);padding:1px 5px;border-radius:5px}
.bub pre{font:12px/1.5 ui-monospace,Menlo,Consolas,monospace;background:rgba(0,0,0,.25);padding:8px 10px;border-radius:9px;overflow:auto;white-space:pre-wrap}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px;margin-top:8px}
.thumbs img,.lib img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:11px;border:1px solid var(--edge);display:block;cursor:zoom-in;background:#0c0c0e}
.ind{margin-left:36px}
/* plan card */
.plan{padding:4px 6px;border-radius:14px;border:1px solid var(--edge);background:var(--g2);box-shadow:inset 0 1px 0 var(--hi)}
.plan .h{display:flex;align-items:center;gap:8px;padding:7px 8px;font-size:12.5px;color:var(--muted);cursor:pointer}
.plan .h b{color:var(--text);font-weight:600}
.plan ol{list-style:none;margin:0;padding:0 8px 8px}
.plan li{display:flex;gap:9px;padding:5px 2px;font-size:13px;align-items:flex-start;border-top:1px solid var(--edge)}
.plan li:first-child{border-top:0}
.mk{width:18px;height:18px;border-radius:6px;flex:none;display:flex;align-items:center;justify-content:center;margin-top:1px;border:1px solid var(--edge)}
.mk.passed{background:var(--grad);border-color:transparent;color:var(--onacc)}.mk.passed svg{width:12px;height:12px;stroke-width:3}
.mk.blocked{border-color:var(--bad);color:var(--bad);font-size:11px;font-weight:800}
.mk.cur{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 18%,transparent)}
.plan li .ev{font-size:11.5px;color:var(--dim)}
.plan li.done-t>div>span{color:var(--muted)}
/* tool steps */
.tools{display:flex;flex-direction:column;gap:2px}
.tc>.r{display:flex;align-items:center;gap:8px;padding:4px 9px;font-size:12.5px;color:var(--muted);cursor:pointer;border-radius:10px}
.tc>.r:hover{background:var(--g2);color:var(--text)}
.tc .lbl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}.tc .lbl b{color:var(--text);font-weight:500}
.tc svg.i{width:15px;height:15px}.ok{color:var(--good)}.no{color:var(--bad)}
.tc .more{display:none;padding:2px 10px 10px}.tc.open{background:rgba(0,0,0,.14);border-radius:10px}.tc.open .more{display:block}
.tc pre,.cmd{margin:6px 0 0;font:11.5px/1.5 ui-monospace,Menlo,Consolas,monospace;color:var(--muted);white-space:pre-wrap;word-break:break-word;max-height:320px;overflow:auto;background:rgba(0,0,0,.22);padding:8px;border-radius:8px}
.x{font-size:11px;color:var(--dim);padding:0 6px;border-radius:6px;background:var(--g2)}
.fold{font-size:12px;color:var(--dim);padding:4px 9px;border-radius:9px;text-align:left;display:flex;gap:6px;align-items:center}.fold:hover{color:var(--text);background:var(--g2)}
/* action cards */
.card{padding:12px 14px;border-radius:14px;border:1px solid color-mix(in srgb,var(--warn) 32%,transparent);background:color-mix(in srgb,var(--warn) 6%,transparent);box-shadow:inset 0 1px 0 var(--hi)}
.card .tt{display:flex;align-items:center;gap:8px;font-weight:600}
.card .ds{color:var(--muted);font-size:13px;margin-top:3px}
.risk{width:9px;height:9px;border-radius:50%;flex:none;background:var(--good)}.risk.medium{background:var(--warn)}.risk.high{background:var(--bad)}
.rtag{font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--dim)}
.out{font-size:12px;color:var(--warn);margin-top:5px}
.link{font-size:12px;color:var(--dim);margin-top:6px;display:inline-flex;gap:4px;align-items:center}.link:hover{color:var(--text)}
.card textarea,.field{width:100%;min-height:72px;resize:vertical;padding:9px 11px;border-radius:10px;border:1px solid var(--edge);background:rgba(0,0,0,.2);outline:none;margin-top:8px}
.field{min-height:0;padding:7px 10px}
.card textarea:focus,.field:focus{border-color:color-mix(in srgb,var(--accent) 55%,transparent)}
.q{margin-top:10px}.q .qh{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--dim);font-weight:700}
.q .qq{font-size:13.5px;margin:2px 0 6px}
.opts{display:flex;flex-wrap:wrap;gap:6px}
.opt{padding:7px 12px;border-radius:11px;border:1px solid var(--edge);background:var(--g2);text-align:left;max-width:100%;box-shadow:inset 0 1px 0 var(--hi)}
.opt small{display:block;color:var(--dim);font-size:11.5px}
.opt.on{border-color:color-mix(in srgb,var(--accent) 60%,transparent);background:var(--soft)}
.btns{display:flex;gap:8px;justify-content:flex-end;margin-top:10px;flex-wrap:wrap}
.btn{padding:7px 14px;border-radius:11px;border:1px solid var(--edge);background:var(--g2);box-shadow:inset 0 1px 0 var(--hi);font-size:13px;transition:.15s}
.btn:hover{background:var(--g3)}.btn.pri{background:var(--grad);color:var(--onacc);font-weight:650;border-color:transparent}.btn.pri:hover{filter:brightness(1.07)}
.btn.sm{padding:4px 10px;font-size:12px}
.typing{color:var(--dim);font-size:12.5px;display:flex;align-items:center;gap:8px}
.hello{margin:11vh auto 0;text-align:center;max-width:560px}
.hello h1{font-size:30px;margin:0 0 6px;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.hello p{color:var(--muted);margin:0 0 18px}
.sugs{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.sug{padding:8px 13px;border-radius:12px;border:1px solid var(--edge);background:var(--g2);font-size:13px;color:var(--muted);box-shadow:inset 0 1px 0 var(--hi)}.sug:hover{color:var(--text)}
/* composer */
.comp{padding:10px 0 14px}
.box{width:min(800px,92%);margin:0 auto;border-radius:18px;background:var(--g2);border:1px solid var(--edge);box-shadow:var(--bevel);transition:.15s}
.box:focus-within{border-color:color-mix(in srgb,var(--accent) 45%,transparent)}
.box textarea{width:100%;border:0;outline:0;background:transparent;resize:none;padding:13px 16px 4px;max-height:34vh;min-height:24px;display:block}
.cb{display:flex;align-items:center;gap:4px;padding:4px 8px 8px}
.seg{display:inline-flex;border-radius:11px;background:rgba(0,0,0,.18);padding:2px;border:1px solid var(--edge)}
.seg button{padding:3px 11px;border-radius:9px;font-size:12px;color:var(--muted);white-space:nowrap}
.seg button.on{background:var(--g3);color:var(--text);box-shadow:inset 0 1px 0 var(--hi)}
.sel{appearance:none;font-size:12px;color:var(--muted);background:rgba(0,0,0,.18);border:1px solid var(--edge);border-radius:11px;padding:4px 24px 4px 10px;max-width:200px;
  background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 13px) 50%,calc(100% - 9px) 50%;background-size:4px 4px;background-repeat:no-repeat}
.sel option{background:#1c1c20;color:#e4e4e7}
.ctx{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;color:var(--dim);padding:0 6px}
.ring{width:16px;height:16px;border-radius:50%}
.send{width:34px;height:34px;border-radius:11px;background:var(--grad);color:var(--onacc);display:inline-flex;align-items:center;justify-content:center}
.send.stop{background:var(--g3);color:var(--text)}
.atts{display:flex;flex-wrap:wrap;gap:6px;padding:10px 12px 0}
.att{position:relative;display:flex;align-items:center;gap:7px;padding:4px 26px 4px 4px;border-radius:10px;border:1px solid var(--edge);background:rgba(0,0,0,.18);font-size:12px;color:var(--muted);max-width:220px}
.att img{width:34px;height:34px;object-fit:cover;border-radius:7px}.att .fi{width:34px;height:34px;border-radius:7px;display:flex;align-items:center;justify-content:center;background:var(--g2)}
.att span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.att button{position:absolute;right:4px;top:50%;transform:translateY(-50%);width:18px;height:18px;border-radius:6px;color:var(--dim);display:flex;align-items:center;justify-content:center}
.att button svg{width:12px;height:12px}
.dropov{position:absolute;inset:8px;z-index:20;border-radius:var(--r);border:1.5px dashed color-mix(in srgb,var(--accent) 60%,transparent);background:color-mix(in srgb,var(--bg) 80%,transparent);display:none;align-items:center;justify-content:center;flex-direction:column;gap:8px;font-size:15px;pointer-events:none}
.dropov svg{width:34px;height:34px;color:var(--accent)}.chatw.dropping .dropov{display:flex}
/* drawer contents */
.job{width:100%;padding:9px 11px;border-radius:12px;border:1px solid transparent;cursor:pointer;text-align:left;display:block}
.job:hover{background:var(--g2)}.job.cur{background:var(--g2);border-color:var(--edge);box-shadow:inset 0 1px 0 var(--hi)}
.job .g{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13px}
.job .m{display:flex;align-items:center;gap:7px;margin-top:4px;font-size:11.5px;color:var(--dim)}
.search{width:100%;padding:8px 11px;border-radius:11px;border:1px solid var(--edge);background:rgba(0,0,0,.18);outline:none;margin-bottom:10px}
.lib{display:grid;grid-template-columns:repeat(auto-fill,minmax(var(--thumb),1fr));gap:8px}
.lib .it{position:relative}.lib img{cursor:grab}
.lib .cap{position:absolute;inset:auto 6px 6px 6px;font-size:10.5px;padding:2px 7px;border-radius:7px;background:rgba(12,12,14,.74);color:#ddd;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:0;transition:.15s;cursor:pointer}
.lib .it:hover .cap{opacity:1}
.mtag{font-size:10px;padding:1px 7px;border-radius:99px;background:color-mix(in srgb,var(--accent) 22%,transparent);color:var(--accent);margin-right:6px;white-space:nowrap}
.lib .mtag{position:absolute;top:6px;left:6px}
.pager{display:flex;align-items:center;gap:6px;margin-top:10px;font-size:12px;color:var(--dim)}
.sec{margin-bottom:18px}.sec>h3{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);margin:0 0 8px;font-weight:700;display:flex;align-items:center;gap:6px}
.themes{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.th{padding:8px;border-radius:12px;border:1px solid var(--edge);background:var(--g2);font-size:12px;text-align:left;box-shadow:inset 0 1px 0 var(--hi)}
.th.on{border-color:color-mix(in srgb,var(--accent) 60%,transparent)}
.sw{display:flex;gap:3px;margin-bottom:6px}.sw i{flex:1;height:16px;border-radius:5px}
.row{display:flex;align-items:center;gap:10px;padding:5px 0;font-size:13px;flex-wrap:wrap}.row label{width:104px;color:var(--muted);flex:none}
.btn{white-space:nowrap}
.range{accent-color:var(--accent);width:100%}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:12.5px}.kv>div:nth-child(odd){color:var(--dim)}
.chips{display:flex;flex-wrap:wrap;gap:5px}.chip{font-size:11.5px;padding:3px 9px;border-radius:99px;border:1px solid var(--edge);display:inline-flex;align-items:center;gap:5px}
.chip .d{width:7px;height:7px;border-radius:50%;background:var(--good)}.chip.off{color:var(--dim)}.chip.off .d{background:var(--bad)}
.adv{display:flex;gap:8px;font-size:12.5px;padding:7px 9px;border-radius:10px;background:var(--g2);margin-bottom:5px;line-height:1.4}
.adv .risk{margin-top:5px}
.mrow{display:flex;align-items:center;gap:8px;padding:7px 2px;border-bottom:1px solid var(--edge);font-size:12.5px}.mrow:last-child{border-bottom:0}
.mrow .nm{flex:1;min-width:0}.mrow .nm b{font-weight:550;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.mrow .nm small{color:var(--dim)}
.fam{font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--accent2)}
.empty{color:var(--dim);text-align:center;padding:22px 8px;font-size:13px}
/* bell popover, toast, lightbox */
.pop{position:fixed;z-index:60;top:54px;right:14px;width:min(400px,94vw);max-height:76vh;overflow:auto;padding:10px;display:none}
.pop.show{display:block;animation:in .16s var(--ease)}
.pop h4{margin:4px 6px 8px;font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim)}
.pop .card{margin-bottom:8px}.pop .jt{font-size:11.5px;color:var(--dim);margin-bottom:4px;cursor:pointer}
.toast{position:fixed;z-index:95;right:16px;bottom:18px;max-width:360px;padding:11px 14px;border-radius:13px;font-size:13px;display:none;cursor:pointer}
.toast.show{display:block;animation:in .2s var(--ease)}
.lightbox{position:fixed;inset:0;z-index:90;background:rgba(6,6,8,.9);display:none;align-items:center;justify-content:center;flex-direction:column;gap:10px}
.lightbox.show{display:flex}.lightbox img{max-width:92vw;max-height:84vh;border-radius:12px}.lightbox .cap{color:#bbb;font-size:12.5px}
</style>
</head>
<body>
<div class="top pywebview-drag-region" id="top">
  <span class="brand">LOKI</span><span class="crumb" id="crumb"></span><span class="sp"></span>
  <button class="ib bell" id="bBell" data-tip="For you — what is waiting for your OK or answer"></button>
  <span class="chipm" id="mach" data-tip="This machine and its driver version">…</span>
  <button class="ib" id="bUpd" data-tip="Update everything — pull master and restart LOKI here; jobs carry on"></button>
  <span class="winc" id="winc"></span>
</div>
<div class="rz rz-r" data-rz="r"></div><div class="rz rz-b" data-rz="b"></div><div class="rz rz-c" data-rz="c"></div>
<div class="frame" id="frame">
  <nav class="rail" id="rail"></nav>
  <aside class="drawer glass" id="drawer-left" data-side="left"></aside>
  <div class="split" id="split-left" data-split="left"></div>
  <main class="chatw glass" id="chatw"></main>
  <div class="split" id="split-right" data-split="right"></div>
  <aside class="drawer glass" id="drawer-right" data-side="right"></aside>
</div>
<div class="menu glass" id="lmenu"></div>
<div class="pop glass" id="pop"></div>
<div class="toast glass" id="toast"></div>
<div class="lightbox" id="lb"><img id="lbImg" alt=""><div class="cap" id="lbCap"></div></div>

<script>
"use strict";
const P = {
  plus:'<path d="M12 5v14M5 12h14"/>', jobs:'<path d="M4 6h16M4 12h16M4 18h10"/>', image:'<rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="9" cy="10" r="2"/><path d="M21 16l-5-5-9 9"/>',
  gear:'<path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/>',
  grid:'<rect x="3" y="3" width="7" height="18" rx="2"/><rect x="14" y="3" width="7" height="8" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/>',
  winmin:'<path d="M5 12h14"/>', winmax:'<rect x="5" y="5" width="14" height="14" rx="2"/>', winres:'<rect x="8" y="4" width="12" height="12" rx="2"/><path d="M16 16v2a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2v-8a2 2 0 0 1 2-2h2"/>', book:'<path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20V3H6.5A2.5 2.5 0 0 0 4 5.5z"/><path d="M8 7h8M8 11h6"/>',
  bell:'<path d="M6 8a6 6 0 1 1 12 0c0 7 3 8 3 8H3s3-1 3-8"/><path d="M10 20a2 2 0 0 0 4 0"/>', refresh:'<path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 3v6h-6"/>',
  send:'<path d="M5 12h14"/><path d="M13 6l6 6-6 6"/>', stop:'<rect x="7" y="7" width="10" height="10" rx="2"/>', play:'<path d="M8 5l11 7-11 7z"/>', check:'<path d="M20 6L9 17l-5-5"/>',
  x:'<path d="M18 6L6 18M6 6l12 12"/>', chev:'<path d="M6 9l6 6 6-6"/>', file:'<path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/>',
  term:'<path d="M4 17l6-5-6-5M12 19h8"/>', eye:'<path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>', flag:'<path d="M4 22V4h12l-2 4 2 4H4"/>',
  msg:'<path d="M21 12a8 8 0 0 1-11.6 7.1L3 21l1.9-6.4A8 8 0 1 1 21 12z"/>', note:'<path d="M5 4h14v12l-4 4H5z"/><path d="M15 20v-4h4"/>', wand:'<path d="M15 4V2M15 10V8M11 6h2M17 6h2M4 20L14 10"/>',
  list:'<path d="M9 6h11M9 12h11M9 18h11"/><path d="M4 6h.01M4 12h.01M4 18h.01"/>', trash:'<path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/>', down:'<path d="M12 4v12M6 10l6 6 6-6M5 20h14"/>',
  swap:'<path d="M7 7h13l-3-3M17 17H4l3 3"/>', left:'<path d="M15 6l-6 6 6 6"/>', right:'<path d="M9 6l6 6-6 6"/>', chip:'<rect x="5" y="5" width="14" height="14" rx="3"/><path d="M9 9h6v6H9zM9 2v3M15 2v3M9 19v3M15 19v3M2 9h3M2 15h3M19 9h3M19 15h3"/>',
  monitor:'<rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/>', palette:'<circle cx="12" cy="12" r="9"/><circle cx="8" cy="10" r="1.2"/><circle cx="12" cy="7.5" r="1.2"/><circle cx="16" cy="10" r="1.2"/><path d="M13 21c-1.5-2 0-4 2-4h3"/>'
};
const ic = (n, c='') => `<svg class="i ${c}" viewBox="0 0 24 24">${P[n]||''}</svg>`;
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const api = async (p, o) => { const r = await fetch(p, o); if (!r.ok) throw new Error(r.status); const t = await r.text(); return t ? JSON.parse(t) : null; };
const post = (p, b, m='POST') => api(p, {method:m, headers:{'content-type':'application/json'}, body: b === undefined ? undefined : JSON.stringify(b)});
const IMG = /\.(png|jpe?g|webp|gif)$/i;
/* a job on the other machine has the id "<id>@<machine>"; its calls go through /peer/<machine> */
const where = id => { const i = String(id || '').lastIndexOf('@'); return i < 0 ? ['', id] : [id.slice(i + 1), id.slice(0, i)]; };
const rb = id => { const [m, x] = where(id); return (m ? `/peer/${encodeURIComponent(m)}` : '') + `/runs/${encodeURIComponent(x)}`; };
const fileUrl = (run, p) => `${rb(run)}/file?path=${encodeURIComponent(p)}`;
const ago = t => { const s = (Date.now() - (typeof t === 'number' ? t*1000 : Date.parse(t))) / 1000; return s < 50 ? 'now' : s < 3600 ? Math.round(s/60)+'m' : s < 86400 ? Math.round(s/3600)+'h' : Math.round(s/86400)+'d'; };
const cap = s => (s = String(s || '').trim()) ? s[0].toUpperCase() + s.slice(1) : s;
function md(t) {
  let s = esc(t).replace(/```([\s\S]*?)```/g, (_, c) => `<pre>${c.replace(/^\w*\n/, '')}</pre>`);
  return s.replace(/`([^`\n]+)`/g, '<code>$1</code>').replace(/\*\*([^*\n]+)\*\*/g, '<b>$1</b>').replace(/\n/g, '<br>');
}
let toastT; function toast(t, onclick) { const e = $('#toast'); e.textContent = t; e.onclick = () => { e.classList.remove('show'); onclick && onclick(); }; e.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => e.classList.remove('show'), 4200); }

/* ---------- state + settings ---------- */
const S = { sel:null, runs:[], local:[], peerRuns:{}, link:null, target:'', tick:0, chat:null, models:[], mode:'agent', prefer:'', atts:[], open:new Set(), libPage:0, seenWaiting:null, planOpen:true, answers:{} };
let CFG = { theme:'glass', accent:null, interview:'always', scale:1, thumb:110, notify:true, wl:22, wr:26, home:{} };
const THEMES = { glass:['#8ccfc4','#8aa4b8','#a596c4','#141417'], midnight:['#7aa2ff','#8f8cf0','#c08cff','#0d1120'], ember:['#f0a868','#e88a6a','#e46f8f','#16110e'],
  forest:['#8fd19e','#b7cf86','#d9c47a','#0f1511'], mono:['#e4e4e7','#b4b4ba','#8f8f96','#141414'], light:['#3f9e90','#5b7d99','#7b68b0','#f3f4f6'] };
let saveT; const saveCfg = () => { clearTimeout(saveT); saveT = setTimeout(() => post('/settings', CFG, 'PUT').catch(() => {}), 350); };
function applyLook() {
  const d = document.documentElement; d.dataset.theme = CFG.theme;
  d.style.setProperty('--scale', CFG.scale || 1); d.style.setProperty('--thumb', (CFG.thumb || 110) + 'px');
  if (CFG.accent) d.style.setProperty('--accent', CFG.accent); else d.style.removeProperty('--accent');
}

/* ---------- frame: rail + one drawer ---------- */
const DRAWERS = { jobs:['Jobs','jobs','Jobs — every job, newest first'], library:['Library','image','Library — every image LOKI made; drag one into the chat'], settings:['Settings','gear','Settings — look, interview, this machine, models'] };
const PRESETS = {
  focus:   {name:'Focus',   tip:'Only the chat',                 left:'',        right:'',        wl:22, wr:24, pv:['', '']},
  classic: {name:'Classic', tip:'Jobs on the left',              left:'jobs',    right:'',        wl:22, wr:24, pv:['a', '']},
  studio:  {name:'Studio',  tip:'Jobs left, Library right',      left:'jobs',    right:'library', wl:20, wr:26, pv:['a', 'a']},
  gallery: {name:'Gallery', tip:'A wide Library beside the chat', left:'library', right:'',        wl:38, wr:24, pv:['aw', '']},
  tune:    {name:'Tuning',  tip:'Jobs left, Settings right',     left:'jobs',    right:'settings',wl:20, wr:28, pv:['a', 'a']},
};
const sideOf = k => CFG.left === k ? 'left' : CFG.right === k ? 'right' : '';
const bodyOf = k => { const sd = sideOf(k); return sd ? document.getElementById('db-' + sd) : null; };
function cols() {
  const L = !!CFG.left, R = !!CFG.right;
  return `58px ${L ? CFG.wl + '%' : '0'} ${L ? '12px' : '0'} minmax(0,1fr) ${R ? '12px' : '0'} ${R ? CFG.wr + '%' : '0'}`;
}
function layout() {
  $('#frame').style.gridTemplateColumns = cols();
  for (const sd of ['left', 'right']) {
    const k = CFG[sd], dr = $('#drawer-' + sd), sp = $('#split-' + sd);
    dr.style.display = k ? '' : 'none'; dr.classList.toggle('open', !!k); sp.style.display = k ? '' : 'none';
    if (!k) { dr.innerHTML = ''; continue; }
    dr.innerHTML = `<div class="dh" draggable="true" data-dragdrawer="${sd}"><span class="t">${DRAWERS[k][0]}</span><span class="sp"></span>
      <button class="ib tu" data-lay="${sd}" data-tip="Layout — move this panel, or pick a preset">${ic('grid')}</button>
      <button class="ib tu" data-close="${sd}" data-tip="Close (Esc)">${ic('x')}</button></div><div class="db" id="db-${sd}"></div>`;
  }
  $('#rail').innerHTML = `<button class="ib tr" id="rNew" data-tip="New job — start fresh (Ctrl/⌘+N)">${ic('plus')}</button>
    ${['jobs','library'].map(k => `<button class="ib tr ${sideOf(k) ? 'on' : ''}" data-dr="${k}" data-tip="${DRAWERS[k][2]}">${ic(DRAWERS[k][1])}</button>`).join('')}
    <span class="sp"></span><button class="ib tr" data-preset-menu="1" data-tip="Layout presets — Focus, Classic, Studio, Gallery, Tuning">${ic('grid')}</button>
    <button class="ib tr ${sideOf('settings') ? 'on' : ''}" data-dr="settings" data-tip="${DRAWERS.settings[2]}">${ic('gear')}</button>`;
  $('#rNew').onclick = newJob;
  document.querySelectorAll('[data-dr]').forEach(b => b.onclick = () => togglePanel(b.dataset.dr));
  document.querySelectorAll('[data-close]').forEach(b => b.onclick = () => { CFG[b.dataset.close] = ''; saveCfg(); layout(); });
  document.querySelectorAll('[data-lay]').forEach(b => b.onclick = e => { e.stopPropagation(); layMenu(b, b.dataset.lay); });
  document.querySelector('[data-preset-menu]').onclick = e => { e.stopPropagation(); layMenu(e.currentTarget, ''); };
  fillDrawer(true);
}
function togglePanel(k) {
  const sd = sideOf(k);
  if (sd) CFG[sd] = '';
  else { const want = CFG.home?.[k] || (k === 'jobs' ? 'left' : 'right'); CFG[want] = k; }
  saveCfg(); layout();
}
function movePanel(k, to) {
  const from = sideOf(k); if (from === to) return;
  const other = CFG[to];
  CFG[to] = k; if (from) CFG[from] = other && other !== k ? other : '';
  CFG.home = Object.assign({}, CFG.home, {[k]: to});
  saveCfg(); layout();
}
function applyPreset(id) { const p = PRESETS[id]; Object.assign(CFG, {left:p.left, right:p.right, wl:p.wl, wr:p.wr, preset:id}); saveCfg(); layout(); }
function layMenu(anchor, sd) {
  const m = $('#lmenu'), k = sd ? CFG[sd] : '';
  const pv = p => `<span class="pv"><i class="${p.pv[0] ? 'a' : ''}" style="width:${p.pv[0] === 'aw' ? 12 : p.pv[0] ? 8 : 0}px"></i><i class="c"></i><i class="${p.pv[1] ? 'a' : ''}" style="width:${p.pv[1] ? 8 : 0}px"></i></span>`;
  m.innerHTML = (k ? `<h5>${DRAWERS[k][0]}</h5>
      <button class="mi" data-mv="${sd === 'left' ? 'right' : 'left'}">${ic(sd === 'left' ? 'right' : 'left')}Move to the ${sd === 'left' ? 'right' : 'left'}</button>
      <button class="mi" data-wide="1">${ic('swap')}${(CFG[sd === 'left' ? 'wl' : 'wr'] > 30) ? 'Narrower' : 'Wider'}</button>` : '')
    + `<h5>Layout presets</h5>` + Object.entries(PRESETS).map(([id, p]) => `<button class="mi ${CFG.preset === id ? 'on' : ''}" data-pre="${id}">${pv(p)}<span><b style="font-weight:550">${p.name}</b><br><small style="color:var(--dim)">${p.tip}</small></span></button>`).join('');
  const r = anchor.getBoundingClientRect();
  m.style.left = Math.min(innerWidth - 250, Math.max(8, r.left)) + 'px'; m.style.top = Math.min(innerHeight - 380, r.bottom + 6) + 'px';
  if (anchor.closest('.rail')) { m.style.left = (r.right + 8) + 'px'; m.style.top = Math.max(8, r.top - 280) + 'px'; }
  m.classList.add('show');
  m.querySelectorAll('[data-mv]').forEach(b => b.onclick = () => { movePanel(k, b.dataset.mv); m.classList.remove('show'); });
  m.querySelectorAll('[data-wide]').forEach(b => b.onclick = () => { const w = sd === 'left' ? 'wl' : 'wr'; CFG[w] = CFG[w] > 30 ? 22 : 38; saveCfg(); layout(); m.classList.remove('show'); });
  m.querySelectorAll('[data-pre]').forEach(b => b.onclick = () => { applyPreset(b.dataset.pre); m.classList.remove('show'); });
}
document.addEventListener('mousedown', e => { if (!e.target.closest('#lmenu') && !e.target.closest('[data-lay],[data-preset-menu]')) $('#lmenu').classList.remove('show'); });
/* drag a panel's title onto the other side to move it */
document.addEventListener('dragstart', e => { const h = e.target.closest?.('[data-dragdrawer]'); if (!h) return;
  e.dataTransfer.setData('application/x-loki-panel', CFG[h.dataset.dragdrawer]); e.dataTransfer.effectAllowed = 'move'; S.dragPanel = CFG[h.dataset.dragdrawer]; });
document.addEventListener('dragend', () => { S.dragPanel = null; document.querySelectorAll('.dropside,.dropside-l,.dropside-r').forEach(x => x.classList.remove('dropside', 'dropside-l', 'dropside-r')); });
function panelDropSide(e) { const r = $('#frame').getBoundingClientRect(); return e.clientX < r.left + r.width / 2 ? 'left' : 'right'; }
document.addEventListener('dragover', e => { if (!S.dragPanel) return; e.preventDefault(); const sd = panelDropSide(e), cw = $('#chatw');
  cw.classList.toggle('dropside-l', sd === 'left'); cw.classList.toggle('dropside-r', sd === 'right'); });
document.addEventListener('drop', e => { if (!S.dragPanel) return; e.preventDefault(); const k = S.dragPanel; S.dragPanel = null; movePanel(k, panelDropSide(e)); });
/* splitters */
let sdrag = null;
document.addEventListener('mousedown', e => { const sp = e.target.closest('.split'); if (!sp) return; sdrag = sp.dataset.split; sp.classList.add('drag'); e.preventDefault(); });
document.addEventListener('mousemove', e => { if (!sdrag) return; const r = $('#frame').getBoundingClientRect();
  if (sdrag === 'left') CFG.wl = Math.min(55, Math.max(14, (e.clientX - r.left - 58) / r.width * 100));
  else CFG.wr = Math.min(55, Math.max(14, (r.right - e.clientX) / r.width * 100));
  CFG.preset = ''; $('#frame').style.gridTemplateColumns = cols(); });
document.addEventListener('mouseup', () => { if (sdrag) { document.querySelectorAll('.split').forEach(x => x.classList.remove('drag')); sdrag = null; saveCfg(); } });

/* ---------- drawers ---------- */
function fillDrawer(force) {
  const jb = bodyOf('jobs');
  if (jb) {
    const q = (S.jobQ || '').toLowerCase(), list = S.runs.filter(r => !q || (r.title || r.goal).toLowerCase().includes(q));
    const keep = document.activeElement?.id === 'jobQ';
    jb.innerHTML = `<input class="search" id="jobQ" placeholder="Find a job…" value="${esc(S.jobQ || '')}">` + (list.length ? list.map(r => `<button class="job ${r.id === S.sel ? 'cur' : ''}" data-run="${esc(r.id)}">
      <div class="g">${esc(r.title || r.goal)}</div><div class="m">${r.machine ? `<span class="mtag" data-tip="Runs on ${esc(r.machine)}">${esc(r.machine)}</span>` : ''}<span class="st ${esc(r.status)}">${esc(r.status)}</span>${r.active && r.status !== 'waiting' ? '<span class="live"></span>' : ''}<span class="sp"></span>${ago(r.updated)}</div></button>`).join('')
      : `<div class="empty">No jobs yet.</div>`);
    const jq = $('#jobQ'); jq.oninput = () => { S.jobQ = jq.value; fillDrawer(); }; if (keep) { jq.focus(); jq.setSelectionRange(jq.value.length, jq.value.length); }
  }
  if (bodyOf('library') && (force || !S.libShown)) loadLibrary();
  if (bodyOf('settings') && force) paintSettings();
}
async function loadLibrary() {
  S.libShown = true; const db = bodyOf('library'); if (!db) return;
  let d; try { d = await api(`/library?page=${S.libPage}&per=40`); } catch (e) { return; }
  const pages = Math.max(1, Math.ceil(d.total / d.per));
  db.innerHTML = d.items.length ? `<div class="lib">${d.items.map(x => { const src = x.src || fileUrl(x.run, x.path), rid = x.machine ? x.run + '@' + x.machine : x.run;
      return `<div class="it"><img loading="lazy" draggable="true" data-ref="${esc(JSON.stringify({run:x.run, path:x.path, mirror:x.mirror, src}))}" src="${src}" data-zoom="${esc((x.machine ? x.machine + ' · ' : '') + x.title + ' — ' + x.path)}" alt="${esc(x.path)}" title="Drag into the chat to use as a reference">${x.machine ? `<span class="mtag" data-tip="Made on ${esc(x.machine)} — copied here by the link">${esc(x.machine)}</span>` : ''}<span class="cap" data-run="${esc(rid)}">${esc(x.title)}</span></div>`; }).join('')}</div>

function label(it) {
  const a = it.args || {}, r = String(it.result || '');
  if (it.owner) {
    if (it.tool === 'image_prompt') return [`You ${it.owner} the image prompt`, 'wand'];
    if (it.tool === 'interview') return [`You answered the interview`, 'msg'];
    if (it.tool === 'ask_owner') return [`You answered: <b>${esc(r.replace(/^OWNER ANSWERED: /, '').slice(0, 100))}</b>`, 'msg'];
    return [`You ${it.owner}: ${esc(cap(a.why || a.command || it.tool))}`, 'check'];
  }
  switch (it.tool) {
    case 'plan': return [`Planned <b>${(a.tasks || []).length} steps</b>`, 'list'];
    case 'write_file': return [`Wrote <b>${esc(a.path)}</b>`, 'file'];
    case 'read_file': return [`Read <b>${esc(a.path)}</b>`, 'eye'];
    case 'list_dir': return [`Looked in <b>${esc(a.path || '.')}</b>`, 'eye'];
    case 'run': { const m = r.match(/^exit (\S+)/); return [`${esc(cap(a.why) || 'Ran a command')}${m && m[1] !== '0' ? ' · <span class="no">failed</span>' : ''}`, 'term']; }
    case 'mark_done': return [r.includes('passed') ? `Step <b>${esc(a.task_id)}</b> done and checked` : `Step <b>${esc(a.task_id)}</b> not done yet`, 'check'];
    case 'block_task': return [`Set step <b>${esc(a.task_id)}</b> aside: ${esc(a.reason)}`, 'flag'];
    case 'add_task': return [`Added step <b>${esc(a.title)}</b>`, 'plus'];
    case 'note': return [esc(a.text), 'note'];
    case 'image_prompt': return [`Asked you to OK an image prompt`, 'wand'];
    case 'inspect_scene': { const m = r.match(/Problems: (.*)$/s); const errs = (r.match(/\[error\]/g) || []).length;
      return [`Checked the scene <b>${esc(a.path)}</b>${m ? ` · ${errs ? `<span class="no">${errs} error${errs > 1 ? 's' : ''}</span>` : 'warnings only'}` : ' · no problems'}`, 'eye']; }
    case 'look': { const m = r.match(/score ([\d.]+)/); return [`Vision check of <b>${esc(a.path)}</b>${m ? ` · <b>${m[1]}/10</b>` : ''}`, 'eye']; }
    case 'learn': return [`Learned: ${esc(a.lesson)}`, 'book'];
    case 'interview': return [`Asked you a few questions`, 'msg'];
    case 'ask_owner': return [`Asked you: ${esc(a.question)}`, 'msg'];
    default: return [esc(it.tool), 'wand'];
  }
}

    paintComposer(); return;
  }
  const r = c.run, tasks = c.tasks || [], live = c.active && ['running','planning','resting'].includes(r.status), done = tasks.filter(t => t.state === 'passed').length;
  head.innerHTML = `<span class="ttl">${esc(r.title || r.goal)}</span><span class="st ${esc(r.status)}">${esc(r.status)}</span>${live ? '<span class="live"></span>' : ''}<span class="sp"></span>
    ${tasks.length ? `<span class="prog" id="progPill" data-tip="Plan — jump to the plan">${done}/${tasks.length}<span class="bar"><i style="width:${done / tasks.length * 100}%"></i></span></span>` : ''}
    ${['stopped','failed'].includes(r.status) ? `<button class="ib" id="bRes" data-tip="Resume — carry on from where it stopped">${ic('play')}</button>` : ''}`;
  if ($('#bRes')) $('#bRes').onclick = () => post(`${rb(S.sel)}/resume`).then(() => poll(true));
  if ($('#progPill')) $('#progPill').onclick = () => { S.planOpen = true; paintChat(true); $('#planCard')?.scrollIntoView({behavior:'smooth', block:'start'}); };
  const sig = `${r.id}|${r.status}|${c.items.length}|${r.steps}|${c.active}|${done}|${tasks.length}|${S.planOpen}|${JSON.stringify(S.answers[r.id] || {})}`;
  if (!force && col.dataset.sig === sig) return;
  const feed = $('#feed'), atBottom = feed.scrollHeight - feed.scrollTop - feed.clientHeight < 90;
  let html = '', group = [], gi = 0, planShown = false;
  const flush = () => {
    if (!group.length) return;
    const merged = []; for (const g of group) { const l = merged[merged.length - 1]; if (l && l.sig === g.sig) l.n++; else merged.push({...g, n:1}); }
    const gid = r.id + ':g' + (gi++), all = S.open.has(gid), SHOW = 5, hide = all ? 0 : Math.max(0, merged.length - SHOW);
    html += `<div class="tools ind">${hide ? `<button class="fold" data-fold="${esc(gid)}">${ic('chev')} ${merged.slice(0, hide).reduce((a, m) => a + m.n, 0)} earlier steps</button>` : ''}${merged.slice(hide).map(m => m.html.replace('<span class="lbl">', m.n > 1 ? `<span class="x">×${m.n}</span><span class="lbl">` : '<span class="lbl">')).join('')}</div>`;
    group = [];
  };
  for (const it of c.items) {
    if (it.kind === 'msg') {
      flush();
      const imgs = (it.files || []).filter(f => IMG.test(f)), mine = it.from === 'owner';
      const text = mine && imgs.length ? it.text.replace(/\n*Attached references: .*$/s, '') : it.text;
      html += `<div class="msg ${mine ? 'me' : 'lk'}">${mine ? '' : '<div class="av">L</div>'}<div class="bub">${md(text)}${imgs.length ? `<div class="thumbs">${imgs.map(f => `<img loading="lazy" src="${fileUrl(r.id, f)}" data-zoom="${esc(f)}" alt="${esc(f)}" draggable="true">`).join('')}</div>` : ''}</div></div>`;
      if (mine && !planShown && tasks.length) { html += `<div class="ind">${planCard(tasks)}</div>`; planShown = true; }
    } else {
      if (it.tool === 'plan' && !it.owner) continue; // the plan card shows it
      const [lbl, icon] = label(it), key = r.id + ':' + it.step + ':' + it.tool + (it.owner || ''), open = S.open.has(key);
      const one = `<div class="tc ${open ? 'open' : ''}" data-key="${esc(key)}"><div class="r">${ic(icon)}<span class="lbl">${lbl}</span>${it.ok ? ic('check', 'ok') : ic('x', 'no')}</div>
        <div class="more"><div style="font-size:11px;color:var(--dim)">${esc(it.provider || '')} ${esc(it.model || '')}</div>
        ${it.tool === 'run' ? `<pre>${esc(it.args?.command || '')}</pre>` : it.tool === 'write_file' ? `<pre>${esc(String(it.args?.content || '').slice(0, 4000))}</pre>` : `<pre>${esc(JSON.stringify(it.args, null, 1)).slice(0, 1800)}</pre>`}
        <pre>${esc(String(it.result || '').slice(0, 3000))}</pre></div></div>`;
      group.push({html: one, sig: open ? key : it.tool + '|' + lbl + '|' + it.ok});
    }
  }
  flush();
  if (!planShown && tasks.length) html = `<div class="ind">${planCard(tasks)}</div>` + html;
  if (r.status === 'waiting') html += `<div class="ind">${actionCard(r, false)}</div>`;
  else if (live) html += `<div class="typing ind"><span class="live"></span>${r.status === 'resting' ? 'Free models are busy — resting, then carrying on' : r.status === 'planning' ? 'Thinking about the plan…' : 'Working…'}</div>`;
  const keep = {}, sameCard = col.dataset.cardFor === r.id + ':' + r.steps;
  col.querySelectorAll('[data-note]').forEach(e => keep[e.dataset.note] = e.value);
  const foc = document.activeElement?.dataset?.note;
  col.innerHTML = html; col.dataset.sig = sig; col.dataset.cardFor = r.id + ':' + r.steps;
  if (sameCard) col.querySelectorAll('[data-note]').forEach(e => { if (keep[e.dataset.note] !== undefined) e.value = keep[e.dataset.note]; });
  if (foc) col.querySelector(`[data-note="${foc}"]`)?.focus();
  if (atBottom || force) feed.scrollTop = feed.scrollHeight;
  if ($('#planH')) $('#planH').onclick = () => { S.planOpen = !S.planOpen; paintChat(true); };
  col.querySelectorAll('.tc .r').forEach(e => e.onclick = () => { const t = e.parentElement, k = t.dataset.key; t.classList.toggle('open'); t.classList.contains('open') ? S.open.add(k) : S.open.delete(k); });
  col.querySelectorAll('[data-fold]').forEach(b => b.onclick = () => { S.open.add(b.dataset.fold); paintChat(true); });
  paintComposer();
}
/* card actions work the same in the chat and in the bell */
document.addEventListener('click', async e => {
  const t = e.target.closest('button'); if (!t) return;
  if (t.dataset.det) { document.querySelectorAll(`[data-cmd="${t.dataset.det}"]`).forEach(c => c.style.display = c.style.display === 'none' ? 'block' : 'none'); return; }
  if (t.dataset.ivq !== undefined) {
    const id = t.dataset.ivrun, ans = S.answers[id] = S.answers[id] || {}, q = t.dataset.ivq, o = t.dataset.o, cur = ans[q] || [];
    ans[q] = t.dataset.multi === '1' ? (cur.includes(o) ? cur.filter(x => x !== o) : [...cur, o]) : (cur[0] === o ? [] : [o]);
    paintChat(true); paintBell(); return;
  }
  const run = t.dataset.yes || t.dataset.no || t.dataset.skip || t.dataset.ivsend || t.dataset.answer; if (!run) return;
  const card = t.closest('[data-card]'), note = card?.querySelector('[data-note]')?.value || '';
  let body = null;
  if (t.dataset.yes) body = {approve:true, note};
  if (t.dataset.no) body = {approve:false, note};
  if (t.dataset.answer) body = {approve:true, note:t.dataset.text};
  if (t.dataset.skip) body = {approve:false, note:''};
  if (t.dataset.ivsend) {
    const r = S.runs.find(x => x.id === run) || S.chat?.run, qs = r?.pending?.args?.questions || [], ans = S.answers[run] || {};
    const parts = qs.map((q, i) => { const other = (ans['o' + i] || '').trim(); const pick = [...(ans[i] || []), ...(other ? [other] : [])]; return pick.length ? `${q.header}: ${pick.join(', ')}` : ''; }).filter(Boolean);
    body = parts.length ? {approve:true, note:parts.join('; ')} : {approve:false, note:''};
  }
  try { await post(`${rb(run)}/reply`, body); delete S.answers[run]; } catch (x) { toast('That did not go through'); }
  poll(true);
});
document.addEventListener('input', e => { const o = e.target.dataset?.other; if (o !== undefined) { const id = e.target.dataset.runO; (S.answers[id] = S.answers[id] || {})['o' + o] = e.target.value; } });

/* attachments */
function addAtt(a) { a.key = Math.random().toString(36).slice(2); S.atts.push(a); paintAtts(); paintComposer(); return a; }
function paintAtts() {
  const el = $('#atts'); if (!el) return; el.style.display = S.atts.length ? 'flex' : 'none';
  el.innerHTML = S.atts.map(a => `<div class="att" title="${esc(a.name)}">${a.thumb ? `<img src="${esc(a.thumb)}" alt="">` : `<span class="fi">${ic('file')}</span>`}<span>${a.busy ? 'Uploading… ' : ''}${esc(a.name)}</span><button data-un="${a.key}">${ic('x')}</button></div>`).join('');
  el.querySelectorAll('[data-un]').forEach(b => b.onclick = () => { S.atts = S.atts.filter(a => a.key !== b.dataset.un); paintAtts(); paintComposer(); });
}
async function upload(f) {
  if (f.size > 512 * 1024 * 1024) { toast(f.name + ' is over 512 MB'); return; }
  const a = addAtt({kind:'upload', file:f, name:f.name, busy:true, thumb:/^image\//.test(f.type) ? URL.createObjectURL(f) : ''});
  try { const r = await api('/upload?name=' + encodeURIComponent(f.name), {method:'POST', body:f}); a.upload = r.upload; a.busy = false; } catch (e) { S.atts = S.atts.filter(x => x !== a); toast('Could not upload ' + f.name); }
  paintAtts(); paintComposer();
}
document.addEventListener('dragstart', e => { const im = e.target.closest?.('img[data-ref], .thumbs img'); if (!im) return;
  const ref = im.dataset.ref || (S.sel ? JSON.stringify({run:S.sel, path:im.alt}) : ''); if (ref) { e.dataTransfer.setData('application/x-loki-ref', ref); e.dataTransfer.effectAllowed = 'copy'; } });

async function send() {
  const inp = $('#inp'); let text = inp.value.trim();
  if (S.atts.some(a => a.busy)) { toast('Still uploading…'); return; }
  const attach = S.atts.map(a => a.mirror ? {mirror:a.mirror} : a.kind === 'ref' ? {run:a.run, path:a.path} : {upload:a.upload});
  if (!text && !attach.length) return; if (!text) text = 'Here are references for this job.';
  try {
    const m = S.sel ? where(S.sel)[0] : S.target;
    // references from the other machine's job are copied over first
    const att = m ? await sendAtts(m) : S.atts.some(a => a.run && where(a.run)[0] && !a.mirror) ? await sendAtts('') : attach;   // the other machine gets its own copies of the references
    if (!S.sel) { const r = await post((m ? `/peer/${encodeURIComponent(m)}` : '') + '/runs', {goal:text, mode:S.mode, prefer:m ? '' : S.prefer, attach:att}); select(m ? r.id + '@' + m : r.id); }
    else await post(`${rb(S.sel)}/say`, {text, attach:att});
    inp.value = ''; inp.style.height = 'auto'; S.atts = []; paintAtts();
  } catch (e) { toast('Could not send — is the driver running?'); }
  poll(true);
}
async function sendAtts(m) {
  const out = [];
  for (const a of S.atts) {
    const blob = a.file || await fetch(a.kind === 'ref' ? (a.src || fileUrl(a.run, a.path)) : '').then(r => r.blob()).catch(() => null);
    if (!blob) continue;
    const r = await api(`${m ? '/peer/' + encodeURIComponent(m) : ''}/upload?name=${encodeURIComponent(a.name)}`, {method:'POST', body:blob}).catch(() => null);
    if (r) out.push({upload:r.upload});
  }
  return out;
}
async function stopJob() { if (S.sel) { await post(`${rb(S.sel)}/stop`).catch(() => {}); toast('Stopped — send a message to carry on'); poll(true); } }
function newJob() { S.sel = null; S.chat = null; paintChat(true); fillDrawer(); paintTarget(); $('#inp')?.focus(); }
function select(id) { S.sel = id; S.chat = null; S.open.clear(); S.planOpen = true; paintTarget(); poll(true); }
$('#bUpd').onclick = async () => { try { await post('/update'); toast('Updating… LOKI restarts in a moment; jobs carry on'); } catch (e) { toast('Update request failed'); } };

/* ---------- bell: For you as a notification ---------- */
$('#bUpd').innerHTML = ic('refresh');
function paintBell() {
  const w = S.runs.filter(r => r.status === 'waiting'), b = $('#bBell');
  b.innerHTML = ic('bell') + (w.length ? `<span class="n">${w.length}</span>` : '');
  const pop = $('#pop'); if (!pop.classList.contains('show')) return;
  const keep = {}; pop.querySelectorAll('[data-note]').forEach(e => keep[e.dataset.note] = e.value);
  pop.innerHTML = `<h4>For you</h4>` + (w.length ? w.map(r => `<div class="jt" data-run="${esc(r.id)}">${esc(r.title || r.goal)} ›</div>${actionCard(r, true)}`).join('') : '<div class="empty">Nothing is waiting for you.</div>');
  pop.querySelectorAll('[data-note]').forEach(e => { if (keep[e.dataset.note] !== undefined) e.value = keep[e.dataset.note]; });
}
$('#bBell').onclick = e => { e.stopPropagation(); $('#pop').classList.toggle('show'); paintBell(); };
document.addEventListener('mousedown', e => { if (!e.target.closest('#pop') && !e.target.closest('#bBell')) $('#pop').classList.remove('show'); });
function notifyNew() {
  const w = S.runs.filter(r => r.status === 'waiting'), ids = w.map(r => r.id + ':' + r.steps);
  if (S.seenWaiting === null) { S.seenWaiting = ids; return; }
  const fresh = w.filter(r => !S.seenWaiting.includes(r.id + ':' + r.steps)); S.seenWaiting = ids;
  if (!fresh.length) return;
  const r = fresh[0], what = r.pending?.name === 'interview' ? 'has a few questions' : r.pending?.name === 'image_prompt' ? 'wants you to OK an image prompt' : r.pending?.name === 'ask_owner' ? 'asks you something' : 'needs your OK';
  $('#bBell').classList.add('ring'); setTimeout(() => $('#bBell').classList.remove('ring'), 2600);
  if (CFG.notify) {
    if (r.id !== S.sel) toast(`${r.title || 'A job'} ${what}`, () => select(r.id));
    if ('Notification' in window && Notification.permission === 'granted' && document.hidden) new Notification('LOKI', {body:`${r.title || 'A job'} ${what}`});
  }
}

/* ---------- misc ---------- */
document.addEventListener('click', e => {
  const im = e.target.closest('img[data-zoom]'); if (im) { $('#lbImg').src = im.src; $('#lbCap').textContent = im.dataset.zoom; $('#lb').classList.add('show'); return; }
  const j = e.target.closest('[data-run]'); if (j && !e.target.closest('.card')) { select(j.dataset.run); $('#pop').classList.remove('show'); }
});
$('#lb').onclick = () => $('#lb').classList.remove('show');
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { $('#lb').classList.remove('show'); $('#pop').classList.remove('show'); $('#lmenu').classList.remove('show'); }
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'n') { e.preventDefault(); newJob(); }
});
let busy = false, peerT = 0;
/* the other machines: their jobs appear in the list (and their questions in the bell) with the machine's name */
async function peers() {
  if (Date.now() - peerT < 8000) return; peerT = Date.now();
  S.link = await api('/link').catch(() => null);
  const on = (S.link?.peers || []).filter(p => p.online);
  await Promise.all(on.map(async p => { const rs = await api(`/peer/${encodeURIComponent(p.name)}/runs`).catch(() => null);
    if (rs) S.peerRuns[p.name] = rs.map(r => Object.assign(r, {id: r.id + '@' + p.name, machine: p.name})); }));
  for (const k of Object.keys(S.peerRuns)) if (!on.some(p => p.name === k)) delete S.peerRuns[k];
  paintTarget();
}
function mergeRuns() { S.runs = S.local.concat(...Object.values(S.peerRuns)).sort((a, b) => String(b.updated).localeCompare(String(a.updated))); }
function paintTarget() {
  const el = $('#runOn'); if (!el) return; const on = (S.link?.peers || []).filter(p => p.online);
  if (S.target && !on.some(p => p.name === S.target)) S.target = '';
  el.style.display = on.length && !S.sel ? '' : 'none';
  el.innerHTML = `<option value="">This machine</option>` + on.map(p => `<option value="${esc(p.name)}">${esc(p.name)}${p.hello?.gpu ? ' · ' + esc(p.hello.gpu) : ''}</option>`).join('');
  el.value = S.target;
}
async function poll(force) {
  if (busy && !force) return; busy = true;
  try {
    S.local = await api('/runs') || []; await peers(); mergeRuns();
    if (S.sel) { const remote = !!where(S.sel)[0];
      if (!remote || force || ++S.tick % 2 === 0) { const c = await api(`${rb(S.sel)}/chat`).catch(() => null); if (c) S.chat = c; } }
    paintChat(force); paintBell(); notifyNew(); if (bodyOf('jobs')) fillDrawer();
  } catch (e) { $('#mach').innerHTML = '<b style="color:var(--bad)">driver offline</b>'; }
  busy = false;
}
/* window: our bar is the title bar; buttons call the launcher (pywebview js_api) */
function windowControls() {
  const api = window.pywebview && window.pywebview.api; if (!api || !api.minimize) return;
  document.body.classList.add('framed');
  $('#winc').innerHTML = `<button class="wb" id="wMin" data-tip="Minimise">${ic('winmin')}</button><button class="wb" id="wMax" data-tip="Maximise">${ic('winmax')}</button><button class="wb x" id="wCls" data-tip="Close the window — LOKI keeps working in the background">${ic('x')}</button>`;
  const setMax = m => { $('#wMax').innerHTML = ic(m ? 'winres' : 'winmax'); $('#wMax').dataset.tip = m ? 'Restore' : 'Maximise'; };
  $('#wMin').onclick = () => api.minimize();
  $('#wMax').onclick = async () => setMax(await api.toggle_max());
  $('#wCls').onclick = () => api.close();
  $('#top').addEventListener('dblclick', async e => { if (!e.target.closest('button')) setMax(await api.toggle_max()); });
  // edges: drag to resize (pointer capture keeps the drag going outside the window)
  document.querySelectorAll('[data-rz]').forEach(h => h.addEventListener('pointerdown', async e => {
    e.preventDefault(); h.setPointerCapture(e.pointerId);
    const [w0, h0] = await api.size(), x0 = e.screenX, y0 = e.screenY, k = h.dataset.rz; let pend = null, t = 0;
    const move = ev => { pend = [k === 'b' ? w0 : w0 + ev.screenX - x0, k === 'r' ? h0 : h0 + ev.screenY - y0];
      const now = Date.now(); if (now - t > 40) { t = now; api.resize(pend[0], pend[1]); pend = null; } };
    const up = () => { if (pend) api.resize(pend[0], pend[1]); h.removeEventListener('pointermove', move); h.removeEventListener('pointerup', up); };
    h.addEventListener('pointermove', move); h.addEventListener('pointerup', up);
  }));
}
window.addEventListener('pywebviewready', windowControls);

async function boot() {
  windowControls();
  try { const s = await api('/settings'); if (s) CFG = Object.assign(CFG, s); } catch (e) {}
  if (!('left' in CFG) && !('right' in CFG)) Object.assign(CFG, {left: CFG.drawer === undefined ? 'jobs' : (CFG.side === 'right' ? '' : CFG.drawer || ''), right: CFG.side === 'right' ? CFG.drawer || '' : '', wl: CFG.width || 22, wr: 26});
  applyLook(); layout(); chatShell(); paintBell();
  api('/status').then(s => {
    const when = s.commit_time ? ago(s.commit_time) : '';
    $('#mach').innerHTML = `<b>${esc(s.machine || s.os)}</b> · v${esc(s.version)}${s.commit ? ` · ${esc(s.commit)}` : ''}`;
    $('#mach').dataset.tip = `This machine runs LOKI ${s.version}, build ${s.commit || '?'}${when ? ` from ${when} ago` : ''}${s.commit_subject ? ': ' + s.commit_subject : ''}. It checks for updates every 10 minutes.`;
    if (s.commit && CFG.seen_commit && CFG.seen_commit !== s.commit) toast(`Updated to ${s.commit}: ${s.commit_subject || 'new version'}`);
    if (s.commit && CFG.seen_commit !== s.commit) { CFG.seen_commit = s.commit; saveCfg(); }
  }).catch(() => {});
  S.local = await api('/runs').catch(() => []) || []; mergeRuns();
  const pick = S.runs.find(r => r.active) || S.runs.find(r => r.status === 'waiting');
  if (pick) select(pick.id); else poll(true);
  loadModels(false);
  setInterval(poll, 1500); setInterval(() => { if (bodyOf('library')) loadLibrary(); }, 15000);
}
boot();
</script>
