<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LOKI</title>
<style>
:root{--bg:#0f1115;--panel:#171a21;--panel2:#1e222b;--line:#2a2f3a;--ink:#e8eaf0;--quiet:#9aa3b2;--accent:#7c9cff;--good:#4cc38a;--warn:#e6b34d;--bad:#ef6b6b;--r:10px;--gap:1.2%}
@media (prefers-color-scheme: light){:root{--bg:#f5f6f8;--panel:#fff;--panel2:#f0f2f6;--line:#dfe3ea;--ink:#171a21;--quiet:#5c6575}}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:14px/1.45 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
button{font:inherit;color:inherit}
.top{display:flex;align-items:center;gap:12px;height:6vh;min-height:44px;padding:0 1.5%;border-bottom:1px solid var(--line)}
.brand{font-weight:700;letter-spacing:.12em}
.sp{flex:1}
.ib{position:relative;display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:8px;border:1px solid var(--line);background:var(--panel);cursor:pointer}
.ib:hover{border-color:var(--accent)}
.ib svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ib[data-tip]:hover::after{content:attr(data-tip);position:absolute;top:calc(100% + 6px);right:0;white-space:pre;z-index:9;background:var(--panel2);border:1px solid var(--line);color:var(--ink);padding:6px 8px;border-radius:6px;font-size:12px;line-height:1.35;width:max-content;max-width:260px;white-space:normal}
.main{display:grid;grid-template-columns:30% 1fr;gap:var(--gap);padding:var(--gap);height:94vh}
@media (max-width:820px),(orientation:portrait){.main{grid-template-columns:1fr;height:auto}}
.col{display:flex;flex-direction:column;gap:12px;min-height:0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.card h3{margin:0 0 10px;font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--quiet)}
textarea{width:100%;min-height:90px;resize:vertical;background:var(--panel2);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:10px;font:inherit}
textarea:focus{outline:none;border-color:var(--accent)}
.row{display:flex;gap:8px;align-items:center}
.btn{padding:8px 14px;border-radius:8px;border:1px solid var(--line);background:var(--panel2);cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#0b0d12;font-weight:600}
.btn.good{border-color:var(--good)}.btn.bad{border-color:var(--bad)}
.runs{overflow:auto;flex:1;display:flex;flex-direction:column;gap:6px}
.run{padding:10px;border-radius:8px;border:1px solid var(--line);background:var(--panel2);cursor:pointer}
.run.sel{border-color:var(--accent)}
.run .g{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip{display:inline-block;font-size:11px;padding:1px 8px;border-radius:99px;border:1px solid var(--line);color:var(--quiet)}
.chip.running,.chip.planning{color:var(--accent);border-color:var(--accent)}
.chip.waiting{color:var(--warn);border-color:var(--warn)}
.chip.done{color:var(--good);border-color:var(--good)}
.chip.failed,.chip.stopped{color:var(--bad);border-color:var(--bad)}
.chip.resting{color:var(--quiet)}
.meta{font-size:12px;color:var(--quiet)}
.detail{overflow:auto;min-height:0}
.foryou{border-color:var(--warn)}
.tasks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.tasks li{display:flex;gap:8px;align-items:flex-start}
.mark{width:18px;flex:none;text-align:center}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(22%,1fr));gap:8px}
.gallery a{display:block;border-radius:8px;overflow:hidden;border:1px solid var(--line);background:var(--panel2)}
.gallery img{display:block;width:100%;aspect-ratio:1;object-fit:cover}
.files{display:flex;flex-wrap:wrap;gap:6px}
pre.log{margin:0;white-space:pre-wrap;font:12px/1.5 ui-monospace,Menlo,Consolas,monospace;color:var(--quiet);max-height:40vh;overflow:auto}
table{width:100%;border-collapse:collapse;font-size:12.5px}
td,th{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left}
.ok{color:var(--good)}.no{color:var(--bad)}
.hidden{display:none}
.empty{color:var(--quiet);padding:20px 4px;text-align:center}
</style>
</head>
<body>
<div class="top">
  <span class="brand">LOKI</span>
  <span class="meta" id="ver"></span>
  <span class="sp"></span>
  <button class="ib" id="bModels" data-tip="Models — which free models answer on this machine"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="M9 9h6v6H9z"/><path d="M9 1v3M15 1v3M9 20v3M15 20v3M1 9h3M1 15h3M20 9h3M20 15h3"/></svg></button>
  <button class="ib" id="bUpdate" data-tip="Update everything — pull master and restart LOKI on this machine"><svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 3v6h-6"/></svg></button>
</div>
<div class="main">
  <div class="col">
    <div class="card">
      <h3>New job</h3>
      <textarea id="goal" placeholder="Describe what to make. One prompt; LOKI plans it and works until it's done."></textarea>
      <div class="row" style="margin-top:8px">
        <span class="meta" id="hint">Runs in the background — closing this window doesn't stop it.</span><span class="sp"></span>
        <button class="btn primary" id="bStart" title="Start this job">Start</button>
      </div>
    </div>
    <div class="card" style="flex:1;display:flex;flex-direction:column;min-height:30vh">
      <h3>Jobs</h3>
      <div class="runs" id="runs"><div class="empty">No jobs yet.</div></div>
    </div>
  </div>
  <div class="col detail" id="detail">
    <div class="card empty" id="nosel">Pick a job, or start one.</div>
  </div>
</div>
<div class="hidden" id="modelsTpl"></div>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let sel = null, view = 'run';
try { sel = localStorage.getItem('loki.sel'); } catch (e) {}
const api = async (path, opts) => { const r = await fetch(path, opts); if (!r.ok) throw new Error(r.status); const t = await r.text(); return t ? JSON.parse(t) : null; };
const post = (path, body) => api(path, {method:'POST', headers:{'content-type':'application/json'}, body: body ? JSON.stringify(body) : undefined});
const ago = t => { const s = (Date.now() - Date.parse(t)) / 1000; return s < 60 ? 'just now' : s < 3600 ? Math.round(s/60)+' min ago' : s < 86400 ? Math.round(s/3600)+' h ago' : Math.round(s/86400)+' d ago'; };
const IMG = /\.(png|jpe?g|webp|gif|svg)$/i;

async function refreshRuns() {
  let runs = [];
  try { runs = await api('/runs'); } catch (e) { $('#runs').innerHTML = '<div class="empty">Driver not answering…</div>'; return; }
  if (!runs.length) { $('#runs').innerHTML = '<div class="empty">No jobs yet.</div>'; return; }
  $('#runs').innerHTML = runs.map(r => `<div class="run ${r.id === sel ? 'sel' : ''}" data-id="${esc(r.id)}">
    <div class="g">${esc(r.goal)}</div>
    <div class="row meta" style="margin-top:4px"><span class="chip ${esc(r.status)}">${esc(r.status)}</span><span>${r.steps} steps</span><span class="sp"></span><span>${ago(r.updated)}</span></div></div>`).join('');
  document.querySelectorAll('.run').forEach(el => el.onclick = () => { sel = el.dataset.id; view = 'run'; try { localStorage.setItem('loki.sel', sel); } catch (e) {} tick(); });
}

async function refreshDetail() {
  if (view === 'models') return;
  if (!sel) { $('#detail').innerHTML = '<div class="card empty">Pick a job, or start one.</div>'; return; }
  let d; try { d = await api('/runs/' + encodeURIComponent(sel)); } catch (e) { return; }
  const r = d.run, tasks = d.tasks || [], files = d.files || [];
  const imgs = files.filter(f => IMG.test(f.path)), other = files.filter(f => !IMG.test(f.path));
  const fileUrl = p => `/runs/${encodeURIComponent(r.id)}/file?path=${encodeURIComponent(p)}&t=${Date.now() >> 12}`;
  const done = tasks.filter(t => t.state === 'passed').length;
  let html = `<div class="card"><div class="row"><span class="chip ${esc(r.status)}">${esc(r.status)}</span><span class="meta">${r.steps} steps · ${done}/${tasks.length} tasks</span><span class="sp"></span>
    ${['running','planning','resting'].includes(r.status) ? `<button class="ib" id="bStop" data-tip="Stop — pause this job; resume any time"><svg viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2"/></svg></button>` : ''}
    ${['stopped','failed'].includes(r.status) ? `<button class="ib" id="bResume" data-tip="Resume — carry on from where it stopped"><svg viewBox="0 0 24 24"><path d="M7 5l12 7-12 7z"/></svg></button>` : ''}
    </div><div style="margin-top:8px">${esc(r.goal)}</div>${r.last_error ? `<div class="meta no" style="margin-top:6px">${esc(r.last_error)}</div>` : ''}</div>`;
  if (r.status === 'waiting') html += `<div class="card foryou"><h3>For you</h3><div>${esc(r.waiting_for)}</div>
    <input id="note" placeholder="Optional note or answer" style="width:100%;margin-top:10px;padding:8px;border-radius:8px;border:1px solid var(--line);background:var(--panel2);color:var(--ink);font:inherit">
    <div class="row" style="margin-top:10px"><span class="sp"></span><button class="btn bad" id="bNo">Decline</button><button class="btn good primary" id="bYes">Approve</button></div></div>`;
  if (imgs.length) html += `<div class="card"><h3>Results</h3><div class="gallery">${imgs.map(f => `<a href="${fileUrl(f.path)}" target="_blank" title="${esc(f.path)}"><img loading="lazy" src="${fileUrl(f.path)}" alt="${esc(f.path)}"></a>`).join('')}</div></div>`;
  html += `<div class="card"><h3>Checklist</h3>${tasks.length ? `<ul class="tasks">${tasks.map(t => `<li><span class="mark ${t.state === 'passed' ? 'ok' : t.state === 'blocked' ? 'no' : ''}">${t.state === 'passed' ? '✓' : t.state === 'blocked' ? '!' : '○'}</span><span>${esc(t.title)}<div class="meta">${esc(t.state === 'todo' ? 'check: ' + t.check : t.evidence)}</div></span></li>`).join('')}</ul>` : '<div class="meta">Planning…</div>'}</div>`;
  if (other.length) html += `<div class="card"><h3>Files</h3><div class="files">${other.slice(0, 60).map(f => `<a class="chip" href="${fileUrl(f.path)}" target="_blank">${esc(f.path)}</a>`).join('')}</div></div>`;
  html += `<div class="card"><h3>Log</h3><pre class="log">${esc(d.progress || '…')}</pre></div>`;
  const keep = $('#note') ? $('#note').value : '';
  $('#detail').innerHTML = html;
  if ($('#note')) $('#note').value = keep;
  const id = r.id;
  if ($('#bStop')) $('#bStop').onclick = () => post(`/runs/${id}/stop`).then(tick);
  if ($('#bResume')) $('#bResume').onclick = () => post(`/runs/${id}/resume`).then(tick);
  if ($('#bYes')) $('#bYes').onclick = () => post(`/runs/${id}/reply`, {approve: true, note: $('#note').value}).then(tick);
  if ($('#bNo')) $('#bNo').onclick = () => post(`/runs/${id}/reply`, {approve: false, note: $('#note').value}).then(tick);
}

async function showModels(refresh) {
  view = 'models';
  $('#detail').innerHTML = `<div class="card"><h3>Free models on this machine</h3><div class="meta">${refresh ? 'Asking every model for a one-word answer…' : 'Loading…'}</div></div>`;
  let rows = [];
  try { rows = await api('/models' + (refresh ? '?refresh=1' : '')); } catch (e) {}
  if (!Array.isArray(rows)) rows = [];
  $('#detail').innerHTML = `<div class="card"><div class="row"><h3 style="margin:0">Free models on this machine</h3><span class="sp"></span>
    <button class="ib" id="bProbe" data-tip="Check again — ask every model for a one-word answer"><svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 3v6h-6"/></svg></button>
    <button class="ib" id="bBack" data-tip="Back to jobs"><svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg></button></div>
    <table style="margin-top:10px"><tr><th>Provider</th><th>Role</th><th>Model</th><th>Result</th></tr>
    ${rows.map(r => `<tr><td>${esc(r.provider)}</td><td>${esc(r.role)}</td><td>${esc(r.model)}</td><td class="${r.ok ? 'ok' : 'no'}">${r.ok ? 'OK ' + r.ms + ' ms' : esc(r.note)}</td></tr>`).join('')}</table>
    <div class="meta" style="margin-top:10px">Keys live in harness_data/.env. Free signups that add capacity: GROQ_API_KEY, OPENROUTER_API_KEY, MISTRAL_API_KEY.</div></div>`;
  $('#bProbe').onclick = () => showModels(true);
  $('#bBack').onclick = () => { view = 'run'; tick(); };
}

$('#bModels').onclick = () => showModels(false);
$('#bUpdate').onclick = async () => { try { await post('/update'); $('#hint').textContent = 'Updating… LOKI restarts in a moment; jobs carry on.'; } catch (e) { $('#hint').textContent = 'Update request failed.'; } };
$('#bStart').onclick = async () => {
  const goal = $('#goal').value.trim(); if (!goal) return;
  $('#bStart').disabled = true;
  try { const r = await post('/runs', {goal}); sel = r.id; view = 'run'; $('#goal').value = ''; try { localStorage.setItem('loki.sel', sel); } catch (e) {} }
  catch (e) { $('#hint').textContent = 'Could not start the job.'; }
  $('#bStart').disabled = false; tick();
};
api('/status').then(s => { $('#ver').textContent = 'v' + s.version; }).catch(() => {});
async function tick() { await refreshRuns(); await refreshDetail(); }
tick(); setInterval(tick, 2500);
</script>
</body>
</html>
