<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0">
<title>$GODOT_PROJECT_NAME</title>
<!-- LOKI World's web shell: no inline script or style (LOKI's page CSP is script-src 'self'
     'wasm-unsafe-eval', style-src 'self'). The exporter fills $GODOT_CONFIG into a JSON data
     block, which a browser never runs; boot.js (app/ui/world_godot/boot.js) reads it. -->
<link rel="stylesheet" href="style.css">
$GODOT_HEAD_INCLUDE
</head>
<body>
<canvas id="canvas" tabindex="0">Your browser does not support the canvas tag.</canvas>
<div id="status">Loading LOKI World...</div>
<script type="application/json" id="godot-config">$GODOT_CONFIG</script>
<script src="$GODOT_URL"></script>
<script src="boot.js"></script>
</body>
</html>
