name: Carbon MMO engine (macOS arm64 + Windows)

# Builds and tests native/carbon_mmo on real macOS arm64 and Windows runners with the same one-command script the
# machines use (tools/build.py), so a cloud agent sees Mac / Windows errors without a machine. The windowed editor
# self-test needs a display, so it is skipped here (--no-editor); the Mac runs it.
on:
  push:
    paths: ["native/carbon_mmo/**", ".github/workflows/carbon-mmo.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Build + tests (tools/build.py)
        shell: bash
        run: |
          # errors become annotations (readable through the API without downloading the log)
          if ! python native/carbon_mmo/tools/build.py --build-dir build --no-editor > run.log 2>&1; then
            grep -iE "error|undefined|unresolved|FAIL|Traceback" run.log | head -25 | while IFS= read -r l; do echo "::error::${l:0:900}"; done
            cat run.log
            exit 1
          fi
          cat run.log
