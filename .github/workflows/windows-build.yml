name: Windows build

on:
  push:
    branches: [master, macos-app]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller -r addons/loki/harness/requirements.txt -r app/requirements.txt

      - name: Offline tests
        run: |
          python tests/test_workers.py
          python tests/test_hardening.py
          python tests/test_integrations.py

      - name: Build Loki.exe
        run: python -m PyInstaller packaging/loki.spec --noconfirm --distpath dist --workpath build/pyi

      - name: Self-test the packaged app
        shell: pwsh
        run: |
          $p = Start-Process "dist\Loki\Loki.exe" -ArgumentList "--self-test" -Wait -PassThru -NoNewWindow
          if ($p.ExitCode -ne 0) { throw "Loki.exe --self-test failed ($($p.ExitCode))" }

      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path dist\Loki -DestinationPath dist\Loki-windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Loki-windows
          path: dist/Loki-windows.zip
          retention-days: 14
