name: Installers

# Builds the installers for other people: a release (seed + zip + signed manifest), the Windows
# setup .exe (Inno Setup) and the macOS .dmg. Manual (or a v* tag) only - it never runs on a push,
# and it publishes nothing: the files are build artifacts. Uploading them to the public release
# feed is a separate, deliberate step (docs/INSTALL.md "Publishing a release").
on:
  workflow_dispatch:
    inputs:
      feed:
        description: "Release feed URL installed copies check for updates (manifest.json)"
        required: false
        default: ""
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.build.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # the patch number counts commits
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the release
        id: build
        env:
          LOKI_RELEASE_FEED: ${{ inputs.feed || vars.LOKI_RELEASE_FEED }}
          SIGNING_KEY: ${{ secrets.LOKI_SIGNING_KEY_PEM }}
        run: |
          if [ -n "$SIGNING_KEY" ]; then
            printf '%s\n' "$SIGNING_KEY" > "$RUNNER_TEMP/loki_signing.pem"
            export LOKI_SIGNING_KEY="$RUNNER_TEMP/loki_signing.pem"
          fi
          python tools/make_release.py --out dist/release --feed "$LOKI_RELEASE_FEED" | tee release.json
          echo "version=$(python -c 'import json;print(json.load(open("dist/release/manifest.json"))["version"])')" >> "$GITHUB_OUTPUT"
          rm -f "$RUNNER_TEMP/loki_signing.pem"
      - uses: actions/upload-artifact@v4
        with:
          name: loki-release
          path: dist/release
          retention-days: 14

  windows:
    needs: release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: loki-release
          path: dist/release
      - name: Install Inno Setup if missing
        shell: pwsh
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue) -and -not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }
      - name: Build Loki-Setup.exe
        shell: pwsh
        run: |
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          & $iscc "/DLokiVersion=${{ needs.release.outputs.version }}" packaging\windows\loki.iss
          if ($LASTEXITCODE -ne 0) { throw "iscc failed" }
      - name: Smoke-test the bootstrap (no window)
        shell: pwsh
        env:
          LOKI_NO_DIALOGS: "1"
          LOKI_DATA: ${{ runner.temp }}\loki-data
        run: |
          New-Item -ItemType Directory -Force -Path "$env:RUNNER_TEMP\loki-app" | Out-Null
          Copy-Item packaging\installer\* "$env:RUNNER_TEMP\loki-app\" -Recurse
          Copy-Item dist\release\seed "$env:RUNNER_TEMP\loki-app\seed" -Recurse
          powershell -NoProfile -ExecutionPolicy Bypass -File "$env:RUNNER_TEMP\loki-app\bootstrap.ps1" -Setup
          if ($LASTEXITCODE -ne 0) { Get-Content "$env:LOKI_DATA\app\bootstrap.log"; throw "bootstrap failed" }
      # Signing (when the secrets exist): signtool sign /fd sha256 /tr http://timestamp.digicert.com /td sha256 /f cert.pfx /p ... dist\Loki-Setup-*.exe
      - uses: actions/upload-artifact@v4
        with:
          name: Loki-Setup-windows
          path: dist/Loki-Setup-*.exe
          retention-days: 14

  macos:
    needs: release
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: loki-release
          path: dist/release
      - name: Build Loki.dmg
        env:
          LOKI_MAC_SIGN_ID: ${{ secrets.LOKI_MAC_SIGN_ID }}
          LOKI_NOTARY_PROFILE: ${{ secrets.LOKI_NOTARY_PROFILE }}
        run: bash tools/macos/make_dmg.sh
      - name: Smoke-test the bootstrap (no window)
        env:
          LOKI_NO_DIALOGS: "1"
          LOKI_DATA: ${{ runner.temp }}/loki-data
        run: |
          bash dist/dmg-stage/Loki.app/Contents/Resources/bootstrap.sh --setup || { cat "$LOKI_DATA/app/bootstrap.log"; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: Loki-macos-dmg
          path: dist/Loki-*.dmg
          retention-days: 14
